<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kvíz: Fyzikálne miskoncepcie - Práca a Energia (vrátane dostredivej sily)</title>
    <style>
        :root {
            --primary: #8b5cf6; /* Violet/Purple color for Energy */
            --primary-hover: #7c3aed;
            --bg-color: #f5f3ff;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body, html { height: 100%; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        .progress-container { width: 100%; height: 6px; background-color: #ddd6fe; position: fixed; top: 0; left: 0; z-index: 10; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.4s ease; }
        .app-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        .quiz-card { background: var(--card-bg); width: 100%; border-radius: 16px; padding: 30px 25px; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.1); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
        .question-header { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 1.05rem; text-align: left; cursor: pointer; transition: all 0.2s ease; color: var(--text-main); font-weight: 500; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #ede9fe; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
        .option-btn.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1rem; line-height: 1.5; display: none; animation: fadeIn 0.4s ease; }
        .feedback-box.show { display: block; }
        .feedback-box.correct-feedback { background-color: var(--correct-bg); border-left: 5px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect-feedback { background-color: var(--incorrect-bg); border-left: 5px solid var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box b { display: block; margin-bottom: 6px; font-size: 1.1rem; }
        .action-btn { margin-top: 20px; background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; width: 100%; display: none; }
        .action-btn:hover { background-color: var(--primary-hover); }
        .action-btn.show { display: block; animation: fadeIn 0.4s ease; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; margin: 0 auto 30px auto; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3); }
        .result-title { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
        .result-msg { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .app-container { padding: 10px; } .quiz-card { padding: 20px 15px; } .question-text { font-size: 1.2rem; } .option-btn { font-size: 0.95rem; padding: 12px 14px; } }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="app-container">
        <div class="quiz-card" id="quizScreen">
            <div class="question-header" id="questionHeader">Otázka 1 / 40</div>
            <div class="question-text" id="questionText">Otázka sa načítava...</div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Ďalšia otázka ➔</button>
        </div>
        <div class="quiz-card result-screen" id="resultScreen">
            <div class="score-circle" id="scoreDisplay">0%</div>
            <div class="result-title" id="resultTitle">Vyhodnotenie</div>
            <div class="result-msg" id="resultMsg">Správa</div>
            <button class="action-btn show" onclick="location.reload()">Spustiť kvíz znova</button>
        </div>
    </div>
    <script>
        const quizData = [{"q": "1. Celú hodinu zo všetkých síl tlačíš do betónového múru, no ten sa ani nepohne. Koľko mechanickej práce z fyzikálneho hľadiska vykonáš?", "options": ["Veľmi veľa, lebo si spotreboval množstvo vlastnej energie.", "Presne nula Joulov.", "Závisí od toho, akou veľkou silou si tlačil.", "Závisí to od hmotnosti múru."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Fyzická únava znamená vykonanú mechanickú prácu.“ <b>Pravda:</b> Mechanická práca (W = F * s) vyžaduje, aby sa teleso v smere sily pohlo. Ak je dráha (s) nula, vykonaná práca je nula, bez ohľadu na to, ako veľmi sa potíš (tvoja energia sa mení len na teplo v svaloch)."}, {"q": "2. Zdvihneš ťažkú činku nad hlavu a držíš ju tam bez pohnutia 10 sekúnd. Kedy konáš mechanickú prácu na činke?", "options": ["Iba počas zdvíhania činky nahor.", "Počas zdvíhania aj počas držania.", "Iba počas držania, lebo to je najťažšie.", "Nekonám žiadnu prácu, činka má stále rovnakú hmotnosť."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Držanie ťažkého predmetu je fyzikálna práca.“ <b>Pravda:</b> Keď činku držíš bez pohnutia, jej dráha je nula (s = 0), takže prácu už nekonáš. Prácu na činke konáš len vtedy, keď ju hýbeš proti smeru gravitácie (nahor)."}, {"q": "3. Družica obieha okolo Zeme po dokonalej kruhovej dráhe. Zemská gravitácia (dostredivá sila) ju neustále ťahá k sebe. Koľko mechanickej práce vykoná táto gravitačná sila na družici za jeden celý obeh?", "options": ["Obrovské množstvo, lebo dráha (obvod) je veľmi dlhá.", "Presne nula Joulov.", "Závisí to od hmotnosti družice.", "Koná zápornú prácu, lebo ju brzdí."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Sila, ktorá drží teleso na orbite, musí konať prácu.“ <b>Pravda:</b> Dostredivá sila smeruje do stredu, ale družica letí po dotyčnici. Uhol medzi silou a dráhou je 90°. Pretože cos(90°) = 0, dostredivá sila NEKONÁ žiadnu prácu!"}, {"q": "4. Roztočíš kameň na špagáte rovnomerne nad hlavou. Špagát ťahá kameň do stredu (dostredivá sila). Koná tento špagát prácu na kameni?", "options": ["Áno, koná kladnú prácu, lebo inak by kameň zastal.", "Áno, koná zápornú prácu.", "Nie, nekoná žiadnu prácu.", "Áno, ale práca sa hneď premieňa na teplo špagátu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Keď napínam špagát, aby som udržal kameň v kruhu, konám na ňom prácu.“ <b>Pravda:</b> Podobne ako pri družici, sila špagátu je kolmá na smer okamžitého pohybu kameňa. Sila pôsobiaca kolmo na dráhu prácu nekoná."}, {"q": "5. Aký účel majú jednoduché stroje (napr. páka, kladka, naklonená rovina) z hľadiska práce?", "options": ["Zmenšujú celkovú vykonanú prácu.", "Zväčšujú celkovú vykonanú prácu.", "Nemodelujú množstvo práce, ale umožňujú použiť menšiu silu na úkor dlhšej dráhy.", "Zvyšujú výkon človeka."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Kladka mi ušetrí prácu.“ <b>Pravda:</b> Zlaté pravidlo mechaniky hovorí: Čo ušetríš na sile, to prerobíš na dráhe. Celková práca zostáva (ideálne) rovnaká, len sa ti to robí ľahšie, pretože ťaháš menšou silou po dlhšom lane."}, {"q": "6. Trenie je často považované za 'zlú' silu. Koná trecia sila mechanickú prácu?", "options": ["Nie, lebo trenie veci iba brzdí.", "Áno, ale len kladnú prácu (pridáva energiu).", "Áno, koná zápornú prácu (odoberá mechanickú energiu).", "Koná prácu, len ak sa teleso zohreje na vysokú teplotu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Brzdiace sily nekonajú prácu, len zastavujú pohyb.“ <b>Pravda:</b> Trecia sila pôsobí proti smeru pohybu (uhol 180°, cos(180°) = -1), preto koná ZÁPORNÚ mechanickú prácu. Tým premieňa kinetickú energiu na tepelnú (vnútornú) energiu."}, {"q": "7. Dvaja robotníci, Adam a Boris, majú vyložiť z dodávky 50 tehál na 1. poschodie. Obaja vynesú rovnaký počet tehál, ale Adam to stihne za 10 minút, zatiaľ čo Borisovi to trvá 20 minút. Kto vykonal VÄČŠIU mechanickú prácu?", "options": ["Adam, lebo bol rýchlejší.", "Boris, lebo sa s tým trápil dlhšie.", "Obaja vykonali presne rovnakú prácu.", "Nedá sa určiť bez zistenia ich srdcového tepu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rýchlejšia práca znamená viac práce.“ <b>Pravda:</b> Práca závisí len od prekonanej sily (hmotnosť tehál) a dráhy (výška poschodia). Keďže obaja vyniesli to isté do rovnakej výšky, vykonali ROVNAKÚ prácu."}, {"q": "8. V nadväznosti na predchádzajúcu otázku: Čo mal Adam (ktorý bol dvakrát rýchlejší) väčšie ako Boris?", "options": ["Potenciálnu energiu.", "Vykonanú prácu.", "Výkon.", "Účinnosť."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Práca a výkon sú synonymá.“ <b>Pravda:</b> Výkon (P = W/t) vyjadruje, AKO RÝCHLO sa práca vykoná. Adam vykonal rovnakú prácu za polovičný čas, mal teda dvojnásobný VÝKON."}, {"q": "9. Žiarovka má údaj 60 W (wattov). Čo to vo fyzike znamená?", "options": ["Že svieti silou 60 Newtonov.", "Že spotrebuje 60 Joulov elektrickej energie každú sekundu.", "Že vyrobí 60 Joulov tepla za minútu.", "Že jej celková energia je 60 W."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Watt je jednotka sily alebo celkového množstva elektriny.“ <b>Pravda:</b> Watt (W) je jednotka výkonu, čo je Jouly za sekundu (J/s). 60 W znamená, že žiarovka premení 60 Joulov energie každú sekundu."}, {"q": "10. Auto A má dvakrát výkonnejší motor ako auto B. Znamená to, že auto A vždy pôjde dvakrát rýchlejšie?", "options": ["Áno, rýchlosť je priamo úmerná výkonu.", "Nie, výkon ovplyvňuje len to, ako rýchlo auto dokáže zrýchľovať, alebo akú prácu dokáže konať proti odporu (ktorý s rýchlosťou prudko rastie).", "Áno, ale len pri jazde z kopca.", "Nie, silnejší motor znamená len väčšiu hmotnosť."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Dvojnásobný výkon = dvojnásobná maximálna rýchlosť.“ <b>Pravda:</b> Odpor vzduchu rastie s druhou až treťou mocninou rýchlosti. Na zdvojnásobenie maximálnej rýchlosti treba často viac než osemnásobný výkon!"}, {"q": "11. Ak dostredivá sila pôsobí na auto, ktoré rovnomerne prechádza zákrutou, ako to ovplyvní jeho kinetickú energiu?", "options": ["Kinetická energia sa zväčší.", "Kinetická energia sa zmenší kvôli zákrute.", "Kinetická energia zostane rovnaká.", "Kinetická energia sa zmení na potenciálnu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Zatáčanie (sila v zákrute) mení energiu auta.“ <b>Pravda:</b> Pretože dostredivá sila nekoná prácu (W = 0), podľa vety o kinetickej energii (W = ΔEk) sa kinetická energia auta nemení. Mení sa len smer jazdy, nie veľkosť rýchlosti."}, {"q": "12. Kinetická energia telesa závisí od jeho rýchlosti. Ak auto zrýchli z 50 km/h na 100 km/h (rýchlosť sa ZDVOJNÁSOBÍ), čo sa stane s jeho kinetickou energiou?", "options": ["Zdvojnásobí sa.", "Zostane rovnaká, len auto pôjde rýchlejšie.", "Zväčší sa štvornásobne.", "Zväčší sa osemnásobne."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Kinetická energia rastie úmerne s rýchlosťou.“ <b>Pravda:</b> Kinetická energia sa počíta ako Ek = 1/2*m*v². Pretože rýchlosť (v) je vo vzorci umocnená na druhú, dvojnásobná rýchlosť znamená 2² = 4-násobnú kinetickú energiu!"}, {"q": "13. Auto ide rýchlosťou 50 km/h a po prudkom zabrzdení zanechá brzdnú dráhu dlhú 15 metrov. Akou dlhou by bola brzdná dráha, keby išlo rýchlosťou 100 km/h a brzdy by vyvíjali rovnakú brzdnú silu?", "options": ["30 metrov (dvakrát viac).", "60 metrov (štyrikrát viac).", "15 metrov (rovnaká).", "Nedá sa určiť bez zistenia hmotnosti auta."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Dvojnásobná rýchlosť = dvojnásobná brzdná dráha.“ <b>Pravda:</b> Pri 100 km/h má auto 4-násobnú kinetickú energiu. Aby brzdy túto energiu zničili prácou (W = F*s), pri rovnakej sile (F) musia pôsobiť na 4-násobne dlhšej dráhe (s = 60 m)!"}, {"q": "14. Mucha letí izbou a na parkovisku stojí obrovský kamión. Kto z nich má väčšiu kinetickú energiu?", "options": ["Kamión, lebo je oveľa ťažší.", "Mucha, lebo sa pohybuje.", "Majú rovnakú energiu, lebo obaja sú na Zemi.", "Závisí to od farby kamióna."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Veľké/ťažké veci majú vždy veľkú energiu.“ <b>Pravda:</b> Kinetická energia je energia POHYBU. Keďže kamión stojí (v = 0), jeho kinetická energia je NULA. Mucha, hoci je ľahučká, sa pohybuje, takže jej kinetická energia je väčšia než nula."}, {"q": "15. Je možné, aby malo teleso zápornú kinetickú energiu?", "options": ["Áno, ak sa pohybuje smerom dozadu (cúva).", "Áno, ak padá smerom nadol.", "Nie, kinetická energia nemôže byť nikdy záporná.", "Áno, ak brzdí (spomaľuje)."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rýchlosť do mínusu znamená kinetickú energiu do mínusu.“ <b>Pravda:</b> Hmotnosť je kladná a rýchlosť vo vzorci (v²) je umocnená na druhú. Aj záporná rýchlosť (cúvanie) po umocnení na druhú dá kladné číslo. Kinetická energia je skalár a nikdy nie je záporná."}, {"q": "16. Aká je polohová (potenciálna) energia knihy, ktorá leží priamo na podlahe tvojej izby (na 3. poschodí paneláku)?", "options": ["Presne nula, pretože leží na zemi.", "Je nenulová vzhľadom na prízemie, ale nulová vzhľadom na podlahu izby.", "Je vždy nekonečná.", "Potenciálna energia sa na objekty v kľude nevzťahuje."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Potenciálna energia má len jednu absolútnu hodnotu.“ <b>Pravda:</b> Potenciálna energia (Ep = mgh) je RELATÍVNA! Závisí od toho, kam si umiestnime 'nulovú hladinu' (h=0). Vzhľadom na tvoju podlahu je Ep = 0. Vzhľadom na ulicu dole má kniha dosť veľkú Ep."}, {"q": "17. Knihu s hmotnosťou 1 kg presunieš zo stola (výška 1 m) hore na poličku (výška 2 m). Záleží na tom, či ju tam zdvihneš priamo kolmo hore, alebo ju prenesieš okľukou cez celú izbu a až potom položíš na poličku?", "options": ["Okľukou získa kniha viac potenciálnej energie.", "Kolmo nahor získa kniha viac potenciálnej energie.", "V oboch prípadoch sa jej potenciálna energia zmení o rovnakú hodnotu.", "Okľukou stratí potenciálnu energiu kvôli treniu vzduchu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Dlhšia dráha = viac vloženej potenciálnej energie.“ <b>Pravda:</b> Gravitačné pole je konzervatívne. To znamená, že zmena potenciálnej energie závisí VÝLUČNE od začiatočnej a konečnej výšky (rozdiel 1 meter), nie od tvaru dráhy."}, {"q": "18. Môže mať teleso zápornú gravitačnú potenciálnu energiu?", "options": ["Nie, energia nikdy nie je záporná.", "Áno, ak sa nachádza pod nami zvolenou nulovou hladinou (napr. v jame).", "Áno, ale len ak má zápornú hmotnosť.", "Nie, gravitácia pôsobí vždy kladne."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Energia, na rozdiel od rýchlosti, nemôže ísť do mínusu.“ <b>Pravda:</b> Ak si nulovú hladinu (h = 0) určíme napríklad na úrovni podlahy, všetko čo je v pivnici (h < 0) má z tohto pohľadu matematicky zápornú potenciálnu energiu."}, {"q": "19. Jablko visí na strome a má gravitačnú potenciálnu energiu 10 J (vzhľadom na zem). Čo sa stane s touto energiou, keď jablko padá?", "options": ["Energia jednoducho zmizne, keď dopadne na zem.", "Energia sa postupne premieňa na kinetickú energiu (jablko zrýchľuje).", "Energia sa premení na hmotnosť jablka.", "Energia sa odrazí späť do stromu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Padaním sa výška a energia stráca.“ <b>Pravda:</b> Energia sa nikdy nestráca! Klesajúca potenciálna energia (výška) sa okamžite transformuje do narastajúcej kinetickej energie (rýchlosti). Tesne pred dopadom má jablko 10 J kinetickej energie."}, {"q": "20. Ktorý systém má elastickú (pružnosti) potenciálnu energiu?", "options": ["Stiahnutá gumička a natiahnutý luk.", "Zohriata voda v hrnci.", "Kameň na vrchole útesu.", "Batéria v mobile."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Potenciálna energia existuje len vo výške (gravitačná).“ <b>Pravda:</b> Potenciálna energia môže byť aj v zdeformovaných pružných telesách (pružina, luk). Keď sa vrátia do pôvodného tvaru, uvoľnia kinetickú energiu."}, {"q": "21. Základný zákon zachovania energie hovorí, že:", "options": ["Energiu treba šetriť zhasínaním svetiel, inak sa zničí.", "Energia nemôže vzniknúť z ničoho ani zaniknúť, môže sa len premieňať z jednej formy na druhú.", "Celková energia vesmíru neustále klesá kvôli čiernym dieram.", "Pohybová energia sa môže úplne stratiť bez akejkoľvek premeny."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Energia sa míňa alebo stráca (zmizne).“ <b>Pravda:</b> Vo fyzike platí prísny zákon zachovania. Ak sa ti zdá, že energia 'zmizla', len sa premenila na inú, menej užitočnú formu (najčastejšie na teplo)."}, {"q": "22. Hojdáš sa na kyvadle (hojdačke). V ktorom bode svojej dráhy máš NAJVÄČŠIU kinetickú energiu?", "options": ["V najvyššom bode (keď na chvíľu zastaneš).", "Presne v strede, klesajúc dole.", "V najnižšom bode dráhy (tesne nad zemou).", "Kinetická energia je všade rovnaká."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Hore mám najviac všetkej energie.“ <b>Pravda:</b> V najvyššom bode máš najvyššiu potenciálnu, ale nulovú kinetickú. Ako klesáš, Ep sa mení na Ek. V najnižšom bode je Ep najmenšia a rýchlosť (Ek) je obrovská – najväčšia!"}, {"q": "23. Vozeň na horskej dráhe sa spustí z prvého kopca (výška 50 m) bez motora, len gravitáciou. Zanedbáme akékoľvek trenie. Môže nasledujúci kopec na dráhe merať 60 m?", "options": ["Áno, ak mal prvý kopec strmý sklon.", "Nie, bez dodania ďalšej energie (motora) sa nemôže dostať vyššie, než bol na začiatku.", "Áno, ak je vozeň dostatočne ťažký.", "Áno, ale len vo vákuu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Rýchlosť vytvorí 'novú' silu, ktorá ma dostane vyššie.“ <b>Pravda:</b> Zákon zachovania energie nepustí. Všetka tvoja počiatočná energia pochádza z 50 metrov výšky. Aj keby neexistovalo trenie, kinetická energia ťa vynesie maximálne naspäť do 50 metrov, ani o cm viac."}, {"q": "24. Keď hodíš loptičku na zem, odrazí sa, ale nedosiahne pôvodnú výšku z ktorej si ju pustil. Kam sa podela „stratená“ energia?", "options": ["Stratila sa do prázdna, vo fyzike sú vždy straty.", "Loptička si ju nechala vo vnútri vo forme zotrvačnosti.", "Premenila sa na tepelnú (vnútornú) energiu deformáciou loptičky a na zvuk.", "Zobrala si ju gravitačná sila Zeme."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Zastavením alebo tlmením energia zaniká.“ <b>Pravda:</b> Nič nezanikne. Časť kinetickej energie sa pri náraze premenila na mikroskopický pohyb atómov (teplo) a zvukové vlny. Celková energia je stále rovnaká, len už nie je 'mechanická'."}, {"q": "25. Auto brzdí a zastaví. Kinetická energia auta zmizla. Čo sa stalo s brzdami?", "options": ["Nič zvláštne, brzdy len zničili energiu.", "Zohriali sa. Kinetická energia sa premenila na ich vnútornú (tepelnú) energiu.", "Zmagnetizovali sa.", "Kinetická energia prešla do volantu a pneumatík ako svetlo."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Brzdy mažú pohyb a energiu anulujú.“ <b>Pravda:</b> Brzdy doslova menia pohyb na teplo (prostredníctvom trenia). Kinetická energia obrovského auta sa zmení na obrovské množstvo tepla, takže brzdové kotúče môžu až žiariť."}, {"q": "26. Vypustíš šíp z napnutého luku kolmo nahor. Aké premeny energie tu nastávajú?", "options": ["Pružnosti (luk) -> Kinetická (šíp) -> Gravitačná potenciálna (šíp v najvyššom bode).", "Kinetická -> Tepelná -> Gravitačná.", "Gravitačná -> Pružnosti -> Kinetická.", "Chemická -> Kinetická -> Pružnosti."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Sila letí do objektu a mení sa na hmotu.“ <b>Pravda:</b> Potenciálna energia luku (napnutá tetiva) sa premení na rýchlosť šípu (kinetická E). Ako šíp stúpa, kinetická E klesá a mení sa na potenciálnu gravitačnú E vo výške."}, {"q": "27. Keď spaľujeme drevo, získavame teplo. Odkiaľ sa táto energia vzala?", "options": ["Vznikla 'z ničoho' samotným procesom horenia.", "Je to uvoľnená chemická potenciálna energia, ktorú strom predtým uložil pomocou fotosyntézy (zo Slnka).", "Pochádza zo zničenia hmotnosti dreva (jadrová reakcia).", "Nachádzala sa v škrtiatku od zápaliek."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Oheň vytvára energiu.“ <b>Pravda:</b> Horenie je len rýchla chemická reakcia. Uvoľňuje chemickú väzbovú energiu, ktorú rastlina absorbovala zo slnečného žiarenia, keď rástla."}, {"q": "28. Skokan o žrdi sa rozbehne, pichne žrď do zeme, tá sa ohne a vyhodí ho nad latku. Aká energia ho primárne vymrštila NAHOR?", "options": ["Jeho gravitačná energia z rozbehu.", "Potenciálna energia pružnosti ohnutej žrde (na ktorú sa predtým zmenila kinetická E bežca).", "Odporová sila vzduchu.", "Tepelná energia skokana."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Žrď je len tyč, o ktorú sa človek oprie rukami.“ <b>Pravda:</b> Ohnutá žrď funguje ako obrovská pružina. Kinetická energia bežca ju zdeformuje (uloží sa Ep pružnosti), a keď sa žrď vyrovnáva, energia sa vracia bežcovi a mení sa na jeho výšku (Ep gravitačnú)."}, {"q": "29. Čo nám hovorí fyzikálna 'účinnosť' (značka η) stroja alebo motora?", "options": ["Aké množstvo paliva sa zmestí do nádrže.", "Akú maximálnu rýchlosť stroj dosiahne.", "Aký podiel (percento) z celkovej dodanej energie stroj premení na VYUŽITEĽNÚ (užitočnú) prácu.", "Aký hluk stroj produkuje."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Účinný stroj = silný stroj.“ <b>Pravda:</b> Účinnosť je pomer. Hovorí nám, koľko energie sa využilo (napr. na pohyb auta) voči tomu, koľko sa muselo dodať (energia z benzínu). Zvyšok sú 'straty' (teplo)."}, {"q": "30. Môže mať nejaký stroj (vrátane elektromotorov či páky) účinnosť vyššiu ako 100 % (η > 1)?", "options": ["Áno, páka to umožňuje, lebo zväčšuje silu.", "Áno, najnovšie elektromotory to dokážu.", "Nie, znamenalo by to, že stroj vyrába viac energie z ničoho, čo porušuje zákon zachovania energie.", "Áno, ale len vo vákuu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Dobrý stroj mi dá viac, než mu dám ja (perpetuum mobile).“ <b>Pravda:</b> Účinnosť nemôže byť NIKDY > 100 %. Prekonať 100 % by znamenalo tvoriť energiu z ničoho."}, {"q": "31. Stará, klasická žiarovka s vláknom mala účinnosť len okolo 5 %. Čo sa stalo so zvyšnými 95 % elektrickej energie?", "options": ["Vyparili sa a zmizli zo siete.", "Premenili sa primárne na nepotrebné TEPLO (vnútornú energiu).", "Vrátili sa späť do elektrárne.", "Zostali v žiarovke a po vypnutí zhasli."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Žiarovka svieti celým svojím výkonom.“ <b>Pravda:</b> Stará žiarovka bola v podstate elektrický ohrievač, ktorý ako vedľajší produkt vydával trochu svetla. 95 % energie išlo do stratového tepla."}, {"q": "32. Aký je rozdiel medzi 'teplom' (tepelnou energiou) a 'teplotou' vo fyzike?", "options": ["Nie je v tom žiadny rozdiel, sú to synonymá.", "Teplota je množstvo energie, Teplo sa meria v stupňoch Celzia.", "Teplo je forma odovzdávanej energie (J), teplota (K, °C) vyjadruje priemernú kinetickú energiu jedného atómu (ako rýchlo sa častice hýbu).", "Teplota je vždy väčšia ako teplo."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Teplo a teplota sú to isté.“ <b>Pravda:</b> Šálka vriacej vody a bazén vlažnej vody: Šálka má vyššiu teplotu (rýchlejšie častice), ale bazén obsahuje neporovnateľne viac celkového TEPLA (energie), lebo má oveľa viac častíc."}, {"q": "33. Je možné v praxi vyrobiť mechanický stroj s účinnosťou presne 100 %?", "options": ["Áno, v moderných strojoch od značkových výrobcov.", "Nie, pretože vždy existuje nejaké trenie, ktoré mení časť práce na nežiadúce teplo.", "Áno, ale iba stroje bez pohyblivých súčiastok (napríklad páka).", "Nie, pretože prúd elektrónov sa zráža s časticami svetla."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „100% účinnosť je len otázkou dokonalej technológie.“ <b>Pravda:</b> Kvôli druhému termodynamickému zákonu a nevyhnutnému treniu medzi súčiastkami (a odporu vzduchu) nie je 100 % účinnosť mechanického stroja možná."}, {"q": "34. Akú zmenu energie vykonáva generátor vo veternej turbíne?", "options": ["Z elektrickej energie na kinetickú.", "Z kinetickej energie vetra (a rotora) na elektrickú energiu.", "Z jadrovej energie na veternú.", "Z potenciálnej energie stĺpa na svetlo."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Vrtuľa robí vietor / vyrába prúd z ničoho.“ <b>Pravda:</b> Generátor je opačný stroj ako elektromotor. Kinetická energia pohybu masy vzduchu roztáča rotor a ten cez magnety a cievky indukuje elektrickú energiu."}, {"q": "35. Sedíš vo vyhriatej miestnosti. Má okolitý vzduch nejakú energiu (ak neberieme do úvahy prúdenie vetra)?", "options": ["Nie, lebo vzduch je neviditeľný a nemá hmotnosť.", "Nie, lebo vzduch stojí.", "Áno, atómy plynu sa neustále pohybujú, takže vzduch má obrovskú vnútornú (tepelnú) energiu.", "Áno, ale len ak do neho zasvieti slnko."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Zdanlivo nehybné (stojace) veci nemajú energiu.“ <b>Pravda:</b> Molekuly plynu v izbe lietajú rýchlosťou stovák m/s! Tento mikroskopický pohyb predstavuje obrovskú tepelnú (vnútornú) energiu vzduchu."}, {"q": "36. Vzorec E = mc² od Einsteina nám hovorí neuveriteľný fakt. Aký?", "options": ["Že elektrina závisí od rýchlosti svetla.", "Že rýchlosť zväčšuje teplo objektu.", "Že samotná HMOTNOSŤ (m) v kľude v sebe ukrýva obrovské množstvo energie (E). Hmotnosť a energia sú ekvivalentné.", "Že energia roztápa hmotnosť."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Teleso v kľude nemá okrem výšky žiadnu energiu.“ <b>Pravda:</b> Podľa slávnej rovnice má každý kilogram akejkoľvek hmoty v sebe „uzamknutú“ gigantickú energiu. Táto energia sa prejavuje napríklad pri jadrových reakciách (štiepenie v atómovej elektrárni)."}, {"q": "37. Auto ide do strmého kopca konštantnou rýchlosťou. Zvyšuje sa jeho kinetická energia?", "options": ["Áno, pretože motor silno hučí a auto stúpa.", "Nie, pretože jeho rýchlosť (v) sa nemení.", "Zmenšuje sa, lebo odpor kopca ho brzdí.", "Áno, rýchlosť a výška sa sčítavajú do kinetickej energie."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Stúpanie do kopca vyžaduje vyššiu kinetickú energiu.“ <b>Pravda:</b> Kinetická energia (Ek) závisí LEN od rýchlosti. Ak je rýchlosť konštantná, Ek sa nemení. Motor koná prácu výlučne na to, aby zväčšoval POTENCIÁLNU energiu (výšku)."}, {"q": "38. Tlačíš rovnaký blok rovnako ďaleko: raz po zemi (kde je trenie) a druhýkrát ho zdvihneš na kolieskový vozík (bez trenia) a tlačíš ho tam. Čo platí pre vykonanú mechanickú prácu z tvojej strany?", "options": ["Pri tlačení po zemi vykonáš viac práce, lebo prekonávaš dodatočnú treciu silu.", "Pri tlačení na vozíku vykonáš viac práce, lebo vozík má hmotnosť.", "V oboch prípadoch vykonáš rovnakú prácu.", "Na vozíku nekonáš žiadnu prácu."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Prenos predmetu o rovnakú vzdialenosť stojí vždy rovnakú prácu.“ <b>Pravda:</b> Práca W = F*s. Pri tlačení po zemi s trením musíš vyvinúť väčšiu silu (F), aby si prekonal trenie. Preto vykonáš väčšiu celkovú prácu, ktorá sa sčasti premení na teplo."}, {"q": "39. Pustíš kameň z výšky. Presne v STREDE svojho pádu k zemi platí pre jeho energiu (za predpokladu izolovaného systému bez odporu vzduchu):", "options": ["Má len potenciálnu energiu.", "Má len kinetickú energiu.", "Jeho potenciálna energia sa presne rovná jeho kinetickej energii (1:1).", "Nemá žiadnu energiu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Zákon zachovania znamená, že energia musí byť naraz buď len Ek, alebo len Ep.“ <b>Pravda:</b> V polovičnej výške stratil kameň polovicu svojej potenciálnej energie (m*g*(h/2)). Tá sa premenila na kinetickú. Takže Ep a Ek sú si v tom momente presne rovné a spolu dávajú celkovú energiu."}, {"q": "40. V akej fyzikálnej jednotke sa NEmeria energia alebo práca?", "options": ["Joule (J).", "Kalória (cal).", "Watt (W).", "Kilowatthodina (kWh)."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Watt (alebo kW) je jednotka energie/práce (častá chyba pri elektrine).“ <b>Pravda:</b> Watt meria VÝKON (J/s). Až Kilowatt-hodina (kWh), teda výkon vynásobený časom, je jednotkou celkovej dodanej elektrickej ENERGIE."}];
        let currentQuestion = 0; let score = 0;
        const questionHeader = document.getElementById('questionHeader');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackBox = document.getElementById('feedbackBox');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');

        function loadQuestion() {
            feedbackBox.className = 'feedback-box'; feedbackBox.innerHTML = '';
            nextBtn.classList.remove('show'); optionsContainer.innerHTML = '';
            const q = quizData[currentQuestion];
            questionHeader.textContent = `Otázka ${currentQuestion + 1} z ${quizData.length}`;
            questionText.innerHTML = q.q;
            progressBar.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerHTML = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = quizData[currentQuestion]; const allBtns = optionsContainer.children;
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.answer) allBtns[i].classList.add('correct');
            }
            if (selectedIndex === q.answer) {
                score++;
                feedbackBox.className = 'feedback-box show correct-feedback';
                feedbackBox.innerHTML = `<b>Správne! 🎉</b> ${q.explanation}`;
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackBox.className = 'feedback-box show incorrect-feedback';
                feedbackBox.innerHTML = `<b>Nesprávne.</b> ${q.explanation}`;
            }
            if (currentQuestion === quizData.length - 1) nextBtn.textContent = 'Zobraziť výsledky ➔';
            nextBtn.classList.add('show');
            setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) loadQuestion(); else showResults();
        }

        function showResults() {
            progressBar.style.width = '100%'; quizScreen.style.display = 'none'; resultScreen.style.display = 'block';
            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreDisplay').innerHTML = `<span>${score}</span><span style="font-size: 1.2rem; opacity: 0.8">/${quizData.length}</span>`;
            document.getElementById('resultTitle').textContent = percentage >= 90 ? "Pán Joulov by ti gratuloval! ⚡" : percentage >= 70 ? "Veľmi dobrá práca! 👍" : percentage >= 50 ? "Dobrý základ. 📚" : "Pozor na energiu! 💡";
            document.getElementById('resultMsg').textContent = percentage >= 90 ? "Úplne si pochopil, že námaha nie je vždy práca (dokonca ani tá dostredivá) a že kinetická energia rastie s mocninou rýchlosti. Skvelé!" : percentage >= 70 ? "Väčšinu mýtov si odhalil. Daj si pozor na vzťah sily a dráhy – najmä keď zvierajú pravý uhol (ako dostredivá sila)." : percentage >= 50 ? "Mýliš si prácu z fyzikálneho hľadiska s biologickou únavou, a výkon s celkovou energiou. Treba prejsť vysvetlenia k otázkam." : "Zopakuj si základy! Ak sila nesmeruje v smere pohybu (ako na orbite), nekoná prácu. Energia sa nikdy nestratí a stroj neprekoná účinnosť 100 %.";
        }
        loadQuestion();
    </script>
</body>
</html>
