<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kvíz: Fyzikálne miskoncepcie - Sily a pohyb</title>
    <style>
        :root {
            --primary: #e11d48; /* Red/Crimson color for Dynamics/Forces */
            --primary-hover: #be123c;
            --bg-color: #fff1f2;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body, html { height: 100%; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        .progress-container { width: 100%; height: 6px; background-color: #fecdd3; position: fixed; top: 0; left: 0; z-index: 10; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.4s ease; }
        .app-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        .quiz-card { background: var(--card-bg); width: 100%; border-radius: 16px; padding: 30px 25px; box-shadow: 0 10px 25px rgba(225, 29, 72, 0.1); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
        .question-header { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 1.05rem; text-align: left; cursor: pointer; transition: all 0.2s ease; color: var(--text-main); font-weight: 500; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #ffe4e6; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
        .option-btn.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1rem; line-height: 1.5; display: none; animation: fadeIn 0.4s ease; }
        .feedback-box.show { display: block; }
        .feedback-box.correct-feedback { background-color: var(--correct-bg); border-left: 5px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect-feedback { background-color: var(--incorrect-bg); border-left: 5px solid var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box b { display: block; margin-bottom: 6px; font-size: 1.1rem; }
        .action-btn { margin-top: 20px; background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; width: 100%; display: none; }
        .action-btn:hover { background-color: var(--primary-hover); }
        .action-btn.show { display: block; animation: fadeIn 0.4s ease; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; margin: 0 auto 30px auto; box-shadow: 0 10px 25px rgba(225, 29, 72, 0.3); }
        .result-title { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
        .result-msg { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .app-container { padding: 10px; } .quiz-card { padding: 20px 15px; } .question-text { font-size: 1.2rem; } .option-btn { font-size: 0.95rem; padding: 12px 14px; } }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="app-container">
        <div class="quiz-card" id="quizScreen">
            <div class="question-header" id="questionHeader">Otázka 1 / 40</div>
            <div class="question-text" id="questionText">Otázka sa načítava...</div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Ďalšia otázka ➔</button>
        </div>
        <div class="quiz-card result-screen" id="resultScreen">
            <div class="score-circle" id="scoreDisplay">0%</div>
            <div class="result-title" id="resultTitle">Vyhodnotenie</div>
            <div class="result-msg" id="resultMsg">Správa</div>
            <button class="action-btn show" onclick="location.reload()">Spustiť kvíz znova</button>
        </div>
    </div>
    <script>
        const quizData = [{"q": "1. Kozmická loď letí hlbokým vesmírom (bez gravitácie a odporu) s vypnutými motormi. Čo sa s ňou stane?", "options": ["Postupne spomalí a zastaví sa.", "Bude pokračovať v pohybe stálou rýchlosťou po priamke.", "Bude pokračovať v pohybe, ale začne spomaľovať.", "Okamžite sa zastaví, lebo na ňu nepôsobí žiadna sila."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Na udržanie pohybu je potrebná sila.“ <b>Pravda:</b> Podľa 1. Newtonovho zákona teleso zostáva v pohybe rovnomerným priamočiarym pohybom, kým naň nepôsobí vonkajšia sila. Žiadna sila = žiadna zmena rýchlosti."}, {"q": "2. Tlačíš ťažkú bedňu po podlahe stálou rýchlosťou. Ako je to so silami?", "options": ["Sila, ktorou tlačíš, je väčšia ako trecia sila.", "Sila, ktorou tlačíš, je rovnako veľká ako trecia sila.", "Trecia sila už nepôsobí, pretože bedňa sa hýbe.", "Sila, ktorou tlačíš, sa neustále zväčšuje."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Ak sa teleso hýbe, sila vpred musí byť väčšia ako sila vzad.“ <b>Pravda:</b> Keďže je rýchlosť stála (žiadne zrýchlenie), výsledná sila je NULA. Tvoja sila presne vyrovnáva trenie."}, {"q": "3. Vyhodíš loptičku kolmo nahor. Keď dosiahne najvyšší bod svojej dráhy (na okamih zastaví), aké sily na ňu pôsobia?", "options": ["Žiadne sily, lebo na okamih stojí.", "Len gravitačná sila smerom nadol.", "Sila tvojho hodu smerom nahor a gravitácia nadol.", "Odstredivá sila smerom nahor."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Sila hodu zostáva v loptičke a tlačí ju hore, v najvyššom bode sa vyrovná s gravitáciou.“ <b>Pravda:</b> Keď loptička opustí ruku, pôsobí na ňu už len gravitačná sila (ak zanedbáme odpor vzduchu), aj keď práve stojí."}, {"q": "4. Sedíš v aute, ktoré prudko zatočí doľava. Ty sa nakloníš doprava. Čo ťa tlačí doprava?", "options": ["Odstredivá sila ťa vytláča z auta.", "Auto do teba naráža zľava, ty sa len snažíš pokračovať rovno.", "Gravitácia sa dočasne posunula.", "Dostredivá sila ťa ťahá von zo zákruty."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Existuje skutočná sila, ktorá ma vyhadzuje von.“ <b>Pravda:</b> Telo má zotrvačnosť a chce ísť rovno. Auto pod tebou zatočí doľava a dvere/sedadlo do teba narazia zľava, aby ťa prinútili zmeniť smer."}, {"q": "5. Balík je vyhodený z lietadla, ktoré letí vodorovne konštantnou rýchlosťou. Akú trajektóriu uvidí pozorovateľ na zemi (ak zanedbáme odpor vzduchu)?", "options": ["Padá kolmo dole.", "Padá po parabole dozadu za lietadlo.", "Padá po parabole dopredu, stále priamo pod lietadlom.", "Na chvíľu sa zastaví vo vzduchu a potom padne kolmo."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Pustený predmet padá hneď kolmo nadol.“ <b>Pravda:</b> Balík má počiatočnú vodorovnú rýchlosť zhodnú s lietadlom. Podľa zotrvačnosti pokračuje vodorovne a zároveň padá, čiže letí po parabole presne pod lietadlom."}, {"q": "6. Na nákupný vozík začneš pôsobiť stálou, nemennou silou (väčšou ako trenie). Ako sa bude vozík pohybovať?", "options": ["Bude sa pohybovať konštantnou rýchlosťou.", "Jeho rýchlosť sa bude neustále zväčšovať (bude rovnomerne zrýchľovať).", "Najprv zrýchli a potom pôjde konštantnou rýchlosťou.", "Bude sa hýbať trhavo."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Stála sila spôsobuje stálu rýchlosť.“ <b>Pravda:</b> Podľa F = m.a, ak je výsledná sila stála a nenulová, teleso musí mať stále zrýchlenie. Čiže jeho rýchlosť neustále rastie."}, {"q": "7. Pustíš ťažkú bowlingovú guľu a ľahké pierko vo vákuovej komore (bez odporu vzduchu). Čo dopadne prvé?", "options": ["Bowlingová guľa, lebo má väčšiu hmotnosť.", "Pierko, lebo má menšiu zotrvačnosť.", "Dopadnú presne naraz.", "Závisí to od výšky pádu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ťažšie predmety padajú rýchlejšie.“ <b>Pravda:</b> Gravitácia ťahá guľu väčšou silou, ale guľa má aj väčšiu hmotnosť (zotrvačnosť), ktorú treba rozhýbať. Tieto efekty sa vyrušia a zrýchlenie (g) je pre všetky telesá rovnaké."}, {"q": "8. Výťah zrýchľuje smerom nahor. Čo platí pre normálovú silu (silu podlahy na tvoje nohy)?", "options": ["Je menšia ako tvoja gravitačná sila (váha).", "Je presne rovnaká ako tvoja gravitačná sila.", "Je väčšia ako tvoja gravitačná sila.", "Normálová sila vo výťahu nepôsobí."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Podlaha na mňa vždy tlačí silou mg.“ <b>Pravda:</b> Ak zrýchľuješ nahor, výsledná sila musí smerovať nahor. Preto sila, ktorou ťa tlačí podlaha, musí prekonávať gravitáciu (citiš sa ťažší)."}, {"q": "9. Padáčkar padá k zemi po otvorení padáka tzv. medznou (terminálnou) rýchlosťou, ktorá je konštantná. Aká je výsledná sila naňho?", "options": ["Gravitácia je väčšia ako odpor vzduchu.", "Odpor vzduchu je väčší ako gravitácia.", "Výsledná sila je nula.", "Nepôsobí na neho žiadna sila."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Pri páde musí byť gravitácia vždy väčšia.“ <b>Pravda:</b> Ak je rýchlosť konštantná, zrýchlenie je nula. Z toho vyplýva, že odpor vzduchu presne vyrovnal gravitačnú silu (výsledná sila je nula)."}, {"q": "10. Pôsobíš rovnakou silou na prázdny (ľahký) a plný (ťažký) vozík. Čo sa stane?", "options": ["Oba zrýchlia rovnako.", "Plný vozík zrýchli viac.", "Prázdny vozík zrýchli viac.", "Plný vozík sa nepohne, kým nezvýšiš silu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rovnaká sila znamená rovnaký pohyb.“ <b>Pravda:</b> Podľa a = F/m, čím má teleso väčšiu hmotnosť (m), tým menšie zrýchlenie (a) získa pri rovnakej sile."}, {"q": "11. Rýchlo idúci kamión sa zrazí s malým komárom. Ktoré teleso pôsobí pri náraze väčšou silou?", "options": ["Kamión pôsobí väčšou silou na komára.", "Komár pôsobí väčšou silou na kamión.", "Oba na seba pôsobia presne rovnako veľkou silou.", "Závisí to od rýchlosti kamióna."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Väčšie/rýchlejšie teleso udrie silnejšie.“ <b>Pravda:</b> 3. Newtonov zákon platí vždy. Sila kamióna na komára je presne rovnaká ako sila komára na kamión. Rozdielny je len následok (obrovské zrýchlenie pre malého komára)."}, {"q": "12. Kniha leží na stole. Gravitácia ju ťahá nadol. Čo je 'reakciou' na túto gravitačnú silu podľa 3. zákona?", "options": ["Sila, ktorou stôl tlačí knihu nahor (normálová sila).", "Sila, ktorou kniha tlačí na stôl.", "Tlak vzduchu pôsobiaci na knihu.", "Gravitačná sila, ktorou kniha priťahuje Zem smerom nahor."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Normálová sila je reakciou na gravitáciu.“ <b>Pravda:</b> Akcia a reakcia musia byť rovnakého typu. Ak Zem ťahá knihu nadol (gravitácia), kniha ťahá Zem nahor (gravitácia)."}, {"q": "13. Pri preťahovaní lanom tím A porazí tím B (tím A ich potiahne k sebe). Čo platí pre sily v lane?", "options": ["Tím A ťahal za lano väčšou silou ako tím B.", "Tím B ťahal za lano menšou silou, lebo prehral.", "Oba tímy ťahali za lano rovnako veľkou silou.", "Sila v lane na strane tímu A bola väčšia."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Víťaz ťahá lano silnejšie.“ <b>Pravda:</b> Lano prenáša silu rovnako na obe strany. Tím A vyhral, pretože sa silnejšie a s väčším trením <i>zaprel do zeme</i>, nie preto, že by lano ťahal väčšou silou ako súper."}, {"q": "14. Magnet priťahuje železný klinec. Priblíži sa klinec k magnetu, alebo magnet ku klincu?", "options": ["Len magnet priťahuje klinec, klinec magnet nepriťahuje.", "Priťahujú sa navzájom rovnako veľkou silou.", "Magnet priťahuje klinec silnejšie, lebo je to magnet.", "Klinec sa zmagnetizuje a odtlačí magnet."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Len aktívny objekt (magnet) vyvíja silu.“ <b>Pravda:</b> Ide o vzájomné pôsobenie. Sila magnetu na klinec je rovnaká ako sila klinca na magnet. Zvyčajne sa však pohne klinec, lebo je ľahší."}, {"q": "15. Ak sily akcie a reakcie sú vždy rovnako veľké a opačne orientované, prečo sa navzájom nevyrušia?", "options": ["Lebo pôsobia na rovnaké teleso, ale pod iným uhlom.", "Lebo akcia je vždy o zlomok sekundy skôr ako reakcia.", "Lebo pôsobia na dve RÔZNE telesá.", "Niekedy sa vyrušia, preto veci stoja na mieste."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „F1 - F2 = 0, takže by sa nič nemalo hýbať.“ <b>Pravda:</b> Sily sa vyrušia len vtedy, ak pôsobia na TO ISTÉ teleso. Akcia pôsobí na teleso A, reakcia na teleso B. Každé teleso reaguje len na sily, ktoré pôsobia naň."}, {"q": "16. Plavec sa v bazéne odrazí od steny rukami, aby zaplával znak. Čo ho v skutočnosti zrýchli vpred?", "options": ["Jeho vlastné svaly, ktoré ho posunú dopredu.", "Sila, ktorou rukami zatlačí na vodu pred sebou.", "Sila, ktorou ho stena potlačí vpred.", "Odpor vody."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Moja sila ma posúva vpred.“ <b>Pravda:</b> Plavec tlačí do steny dozadu (akcia). Stena tlačí do plavca dopredu (reakcia). Práve táto vonkajšia sila od steny zrýchli plavca vpred."}, {"q": "17. Kráčaš dopredu po asfalte. Akým smerom pôsobí trecia sila medzi asfaltom a tvojou topánkou?", "options": ["Smerom dozadu, proti tvojmu pohybu.", "Smerom dopredu, v smere tvojho pohybu.", "Zvislo nahor, proti gravitácii.", "Žiadne trenie tam nie je."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Trenie pôsobí vždy proti pohybu telesa.“ <b>Pravda:</b> Tvoja noha sa snaží šmyknúť po zemi <i>dozadu</i>. Trenie bráni tomuto šmyku, a preto na nohu pôsobí <i>dopredu</i>. Vďaka treniu vôbec môžeš kráčať vpred."}, {"q": "18. Snažíš sa potlačiť ťažkú skriňu, ale tá sa ani nepohne. Najprv tlačíš silou 50 N, potom silou 100 N (skriňa stále stojí). Čo sa deje so statickým trením?", "options": ["Je stále rovnaké (konštantné) bez ohľadu na tvoju silu.", "Najprv je 50 N a potom sa zväčší na 100 N.", "Je vždy menšie ako sila, ktorou tlačíš.", "Klesá, čím silnejšie tlačíš."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Statické trenie má jednu pevnú hodnotu.“ <b>Pravda:</b> Statické trenie sa mení a vždy presne vyrovnáva aplikovanú silu (až kým neprekročí svoju maximálnu hranicu a skriňa sa nepohne)."}, {"q": "19. Ktoré trenie je za normálnych okolností väčšie: maximálne statické trenie alebo šmykové (kinetické) trenie?", "options": ["Šmykové trenie je väčšie.", "Maximálne statické trenie je väčšie.", "Obe sú vždy úplne rovnaké.", "Závisí to len od rýchlosti pohybu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Rozbehnutý predmet trie o podložku silnejšie.“ <b>Pravda:</b> Rozbehnúť ťažkú skriňu z miesta (prekonať max. statické trenie) je oveľa ťažšie, než ju potom udržať v pohybe (šmykové trenie). Preto sa napríklad autu so zablokovanými kolesami predlžuje brzdná dráha."}, {"q": "20. Prečo majú autá systém ABS (protiblokovací systém bŕzd)?", "options": ["Aby sa kolesá pri brzdení zablokovali a auto zastavilo vďaka šmykovému treniu.", "Aby brzdy nevyhoreli z prehriatia.", "Aby zabránil zablokovaniu kolies a zachovalo sa statické trenie, ktoré je väčšie ako šmykové.", "Aby znížil trenie na nulu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Najlepšie auto zabrzdí, keď pneumatiky pištia v šmyku.“ <b>Pravda:</b> Kým sa koleso odvaľuje (nešmýka sa po asfalte), miesto dotyku s vozovkou v danom okamihu voči zemi stojí (statické trenie). Statické trenie brzdí lepšie ako šmykové."}, {"q": "21. Valivý odpor (trenie) pri kolesách je v porovnaní so šmykovým trením u toho istého telesa zvyčajne:", "options": ["Oveľa menší.", "Presne rovnaký.", "Oveľa väčší.", "Záporný (zrýchľuje teleso)."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Trenie ako trenie, kolesá len menia tvar.“ <b>Pravda:</b> Valivý odpor spočíva v deformácii pneumatiky/podložky a je rádovo oveľa menší ako šmykové trenie. Práve preto sme vôbec vynaliezli koleso!"}, {"q": "22. Ak auto zrýchľuje vpred, aký smer má trecia sila, ktorá pôsobí na jeho HNACIE kolesá zo strany asfaltu?", "options": ["Dozadu, proti pohybu auta.", "Dopredu, v smere pohybu auta.", "Smeruje do stredu kolesa.", "Žiadna trecia sila na ne nepôsobí."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Trenie na auto vždy brzdí.“ <b>Pravda:</b> Hnacie koleso sa snaží po asfalte 'pretáčať' smerom dozadu. Statické trenie pôsobí proti tomuto prešmyknutiu, čiže pôsobí DOPREDU. Je to sila, ktorá auto reálne poháňa!"}, {"q": "23. Závisí veľkosť šmykového trenia medzi bedňou a podlahou od toho, akou plochou (na ktorú stranu) bedňu položíš?", "options": ["Áno, na väčšej ploche je vždy väčšie trenie.", "Áno, na menšej ploche je väčšie trenie.", "Nie, veľkosť plochy trenie (podľa základného Coulombovho zákona trenia) neovplyvňuje.", "Áno, ale len pri plastových povrchoch."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Širšie pneumatiky majú väčšie trenie vďaka väčšej ploche.“ <b>Pravda:</b> Štandardný vzorec Ft = f * Fn nezávisí od obsahu plochy. Väčšia plocha = menší tlak na cm², takže výsledná trecia sila zostáva konštantná (pneumatiky fungujú zložitejšie kvôli lepivosti gumy)."}, {"q": "24. Bedňa sa kĺže dolu naklonenou rovinou rovnomerne (rýchlosť sa nemení). Čo platí pre treciu silu?", "options": ["Neexistuje žiadna trecia sila.", "Trecia sila je presne rovnako veľká ako zložka gravitačnej sily ťahajúcej bedňu nadol.", "Trecia sila je menšia ako gravitácia.", "Trecia sila je väčšia ako gravitácia."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Pohyb znamená prevahu sily vpred.“ <b>Pravda:</b> Rovnomerný pohyb znamená výslednú silu nula. Trenie smerujúce do svahu presne vyrovnáva zložku gravitácie smerujúcu zo svahu."}, {"q": "25. Padá tehla s hmotnosťou 2 kg a tehla s hmotnosťou 1 kg. Aký je vplyv zotrvačnosti na ich pád?", "options": ["Zotrvačnosť nemá žiadny vplyv.", "Väčšia zotrvačnosť (2 kg tehly) bráni jej rýchlejšiemu rozbiehaniu, čo kompenzuje väčšiu gravitačnú silu.", "Zotrvačnosť ťahá tehly nahor.", "Zotrvačnosť zrýchľuje pád ťažšej tehly."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Zotrvačnosť nie je pri páde dôležitá.“ <b>Pravda:</b> Na 2 kg tehlu pôsobí 2x väčšia gravitačná sila, ale má aj 2x väčšiu zotrvačnosť (neochotu zrýchliť). Výsledné zrýchlenie (g = F/m) je preto rovnaké."}, {"q": "26. V akej situácii sa uplatňuje valivé trenie (valivý odpor)?", "options": ["Keď ťaháš sánky po snehu.", "Keď brzdiace auto s pískaním kolies ide do šmyku.", "Keď gulička z ložiska rovnomerne cestuje po dráhe bez prešmykovania.", "Keď držíš knihu pritlačenú o stenu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Každý pohyb kolesa je len šmykové trenie.“ <b>Pravda:</b> Sánky a brzdiace zablokované auto majú šmykové trenie. Gulička alebo pneumatika, ktorá sa odvaľuje, prekonáva valivý odpor spôsobený deformáciou povrchov."}, {"q": "27. Roztočíš loptičku na špagáte. Zrazu sa špagát pretrhne. Akou dráhou poletí loptička pri pohľade zhora?", "options": ["Poletí priamo od stredu otáčania preč (radiálne).", "Poletí po dotyčnici ku kružnici (tangenciálne) v smere rýchlosti.", "Bude ďalej lietať do kruhu, ale väčšieho.", "Zastaví sa a padne dole."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Odstredivá sila vystrelí loptičku priamo od stredu von.“ <b>Pravda:</b> Ak zmizne dostredivá sila (špagát), na teleso v horizontálnom smere nič nepôsobí. Zotrvačnosť ho núti letieť po priamke - teda po dotyčnici ku kružnici v mieste pretrhnutia."}, {"q": "28. Čo zabezpečuje dostredivú silu, ktorá drží Mesiac na obežnej dráhe okolo Zeme?", "options": ["Je to špeciálna 'dostredivá sila', odlišná od všetkých iných.", "Gravitačná sila Zeme.", "Magnetické pole Zeme.", "Odstredivá sila vesmíru."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Dostredivá sila je nejaká nová, samostatná sila.“ <b>Pravda:</b> 'Dostredivá' je len rola (funkcia). V tomto prípade rolu dostredivej sily plní obyčajná gravitačná sila."}, {"q": "29. Čo plní rolu dostredivej sily, keď auto zatáča na plochej ceste?", "options": ["Sila motora auta.", "Odstredivá sila zvnútra auta.", "Statické trenie medzi pneumatikami a vozovkou.", "Tlak vzduchu na bok auta."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Auto do zákruty tlačí volant.“ <b>Pravda:</b> Bez trenia by auto išlo po ľade rovno (zotrvačnosť). Rolu dostredivej sily, ktorá zmení smer auta smerom do stredu zákruty, tu hrá statické trenie kolies o asfalt."}, {"q": "30. Astronauti na Medzinárodnej vesmírnej stanici (ISS) zažívajú stav beztiaže. Prečo?", "options": ["Lebo v tej výške už nie je zemská gravitácia.", "Lebo sú v hlbokom vesmíre mimo slnečnej sústavy.", "Lebo odstredivá sila tam presne vyruší gravitáciu.", "Lebo ISS aj astronauti neustále spoločne padajú voľným pádom smerom k Zemi."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Vo vesmíre nie je gravitácia (0 g).“ <b>Pravda:</b> Gravitácia na ISS je stále cca 90 % z tej na povrchu. Sú v beztiažovom stave, pretože stanica aj oni v nej neustále 'padajú' dookola Zeme dostatočnou rýchlosťou, takže nikdy nedopadnú."}, {"q": "31. Roztočíš vedro s vodou vo vertikálnej rovine (zhora nadol). V najvyššom bode sa voda nevyleje na tvoju hlavu. Prečo?", "options": ["Lebo v najvyššom bode zmizne gravitácia.", "Lebo zotrvačnosť (rýchlosť vody vpred) chce pokračovať po dotyčnici, a dno vedra vodu musí tlačiť nadol do kruhu.", "Lebo voda vo vedre vtedy nemá žiadnu hmotnosť.", "Lebo dostredivá sila ťahá vodu nahor preč od tvojej hlavy."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Odstredivá sila ťahá vodu z vedra von (hore).“ <b>Pravda:</b> Voda má snahu letieť rovno vpred mimo kruhu. Ak má dostatočnú rýchlosť, gravitácia (plus dno vedra) akurát stihne zahnúť dráhu vody smerom nadol presne po kružnici, takže voda nestihne 'spadnúť' skôr ako samotné vedro."}, {"q": "32. Auto ide po ceste a prechádza hlbokým údolím (vybraním v tvare 'U'). Akú normálovú silu pociťujú pasažieri v najnižšom bode?", "options": ["Sú ľahší (normálová sila je menšia ako gravitácia).", "Sú rovnako ťažkí ako na rovine.", "Sú ťažší (normálová sila je väčšia ako gravitácia).", "Cítia stav beztiaže."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „V jame sa cítim ťažšie kvôli gravitácii.“ <b>Pravda:</b> Aby auto zatočilo z klesania do stúpania (kruhový pohyb), výsledná dostredivá sila musí smerovať nahor (do stredu kružnice). Sedadlo preto musí tlačiť pasažiera silnejšie, než je jeho gravitácia. Pasažier sa cíti zatlačený do sedadla."}, {"q": "33. Čo je v klasickej fyzike (v inerciálnych vzťažných sústavách) „odstredivá sila“?", "options": ["Je to skutočná sila, ktorou Zem tlačí veci preč.", "Je to Newtonova reakcia na dostredivú silu v tom istom telese.", "Je to zdanlivá (fiktívna) sila pociťovaná len z pohľadu otáčajúcej sa sústavy kvôli zotrvačnosti.", "Je to synonymum pre dostredivú silu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Odstredivá sila je reálna sila vyvolaná rotáciou.“ <b>Pravda:</b> Z pohľadu vonkajšieho nehybného pozorovateľa odstredivá sila neexistuje. Je to len prejav zotrvačnosti telesa snaziaceho sa pokračovať v priamom pohybe, keď ho niečo iné (napr. dvere auta) dookola núti zatáčať."}, {"q": "34. Kyvadlo prechádza svojou najnižšou polohou. Čo platí pre ťahovú silu vlákna T a tiažovú silu G?", "options": ["T = G", "T < G", "T > G", "T = 0"], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „V najnižšom bode lanko znáša len tiaž závažia.“ <b>Pravda:</b> Keďže ide o pohyb po kružnici, v najnižšom bode musí byť výsledná sila dostredivá (smerom nahor). Preto ťah lanka T musí prekonať gravitáciu G (T - G = Fd), takže T je väčšie."}, {"q": "35. Dvaja korčuliari na ľade (dospelý muž a malé dieťa) sa od seba navzájom odtlačia rovnakým pohybom rúk. Čo sa stane?", "options": ["Muž pôsobí väčšou silou, takže dieťa odletí dozadu a muž ostane stáť.", "Obe sily sú rovnaké. Obaja sa pohnú dozadu, ale dieťa odletí vyššou rýchlosťou (zrýchlením).", "Muž pôsobí menšou silou, lebo je ťažší.", "Obaja odletia presne rovnakou rýchlosťou."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Silnejší chlap pôsobí väčšou silou.“ <b>Pravda:</b> Podľa 3. Newtonovho zákona sú sily presne rovnaké. Podľa 2. zákona (a=F/m) tá istá sila spôsobí menšiemu teliesku (dieťaťu) väčšie zrýchlenie."}, {"q": "36. Prečo sa kotúľajúca sa futbalová lopta na tráve nakoniec zastaví?", "options": ["Lebo jej postupne dôjde 'sila pohybu'.", "Lebo zotrvačnosť sa po čase vyčerpá.", "Lebo na ňu pôsobia vonkajšie sily (trenie, valivý odpor, odpor vzduchu), ktoré jej odoberajú energiu.", "Lebo hmotnosť lopty rastie úmerne s časom."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Pohybujúci sa objekt sa prirodzene sám od seba zastaví (Aristotelovská fyzika).“ <b>Pravda:</b> Zotrvačnosť sa nevyčerpá. Lopta by sa kotúľala večne, nebyť vonkajších brzdiacich síl (odpor trávy)."}, {"q": "37. Auto narazí do steny. Pasažier bez pásov vyletí cez čelné sklo. Ktorá sila ho vymrštila von?", "options": ["Sila nárazu (dopredná odstredivá sila).", "Sila motora.", "Žiadna. Bola to jeho zotrvačnosť (1. Newtonov zákon).", "Sila od zadných sedadiel."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Náraz vytvoril obrovskú silu, ktorá pasažiera vyhodila.“ <b>Pravda:</b> Žiadna sila pasažiera dopredu nevyhodila. Auto sa zastavilo (narazilo), ale pasažier voľne pokračoval vo svojom predchádzajúcom pohybe vpred."}, {"q": "38. Stojíš na váhe vo výťahu, ktorý zrýchľuje smerom DOLE. Čo ukáže váha?", "options": ["Ukáže tvoju normálnu hmotnosť.", "Ukáže nulovú hmotnosť.", "Ukáže menšiu hmotnosť (menej kíl).", "Ukáže väčšiu hmotnosť (viac kíl)."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Pohyb dolu = priťahuje ma to viac.“ <b>Pravda:</b> Váha ukazuje normálovú silu, ktorou podlaha tlačí proti tebe. Ak výťah uniká spod nôh (zrýchľuje dole), podlaha do teba tlačí slabšie ako je tvoja tiaž. Cítiš sa ľahší."}, {"q": "39. Vypáliš z pušky guľku vodorovne a zároveň v rovnakej výške pustíš z ruky na zem druhú takú istú guľku. Zanedbáme odpor vzduchu. Ktorá dopadne skôr?", "options": ["Pustená guľka dopadne oveľa skôr.", "Vystrelená guľka dopadne skôr.", "Dopadnú úplne naraz.", "Vystrelená guľka nikdy nespadne."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rýchlosť vpred nejakým spôsobom 'nadnáša' predmet alebo bráni pádu.“ <b>Pravda:</b> Horizontálny pohyb a vertikálny pád sú nezávislé. Obe guľky priťahuje rovnaká gravitácia (g) z rovnakej výšky, preto dopadnú na zem v rovnakom čase."}, {"q": "40. Pôsobíš veľkou silou na tehlový múr, ale ten sa ani nepohne. Konáš pri tom mechanickú prácu?", "options": ["Áno, pretože spotrebúvaš vlastnú svalovú energiu a si unavený.", "Áno, ale len veľmi malú prácu.", "Nie, z fyzikálneho hľadiska prácu nekonáš, lebo stena neprešla žiadnu dráhu.", "Závisí to od plochy steny."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Fyzická námaha = fyzikálna mechanická práca.“ <b>Pravda:</b> Práca W = F * s. Aj keď pôsobíš obrovskou silou (F), dráha (s) je nulová. 1000 N * 0 m = 0 J. Tvoja námaha ide len do biologického tepla."}];
        let currentQuestion = 0; let score = 0;
        const questionHeader = document.getElementById('questionHeader');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackBox = document.getElementById('feedbackBox');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');

        function loadQuestion() {
            feedbackBox.className = 'feedback-box'; feedbackBox.innerHTML = '';
            nextBtn.classList.remove('show'); optionsContainer.innerHTML = '';
            const q = quizData[currentQuestion];
            questionHeader.textContent = `Otázka ${currentQuestion + 1} z ${quizData.length}`;
            questionText.innerHTML = q.q;
            progressBar.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerHTML = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = quizData[currentQuestion]; const allBtns = optionsContainer.children;
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.answer) allBtns[i].classList.add('correct');
            }
            if (selectedIndex === q.answer) {
                score++;
                feedbackBox.className = 'feedback-box show correct-feedback';
                feedbackBox.innerHTML = `<b>Správne! 🎉</b> ${q.explanation}`;
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackBox.className = 'feedback-box show incorrect-feedback';
                feedbackBox.innerHTML = `<b>Nesprávne.</b> ${q.explanation}`;
            }
            if (currentQuestion === quizData.length - 1) nextBtn.textContent = 'Zobraziť výsledky ➔';
            nextBtn.classList.add('show');
            setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) loadQuestion(); else showResults();
        }

        function showResults() {
            progressBar.style.width = '100%'; quizScreen.style.display = 'none'; resultScreen.style.display = 'block';
            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreDisplay').innerHTML = `<span>${score}</span><span style="font-size: 1.2rem; opacity: 0.8">/${quizData.length}</span>`;
            document.getElementById('resultTitle').textContent = percentage >= 90 ? "Isaac Newton by bol hrdý! 🍎" : percentage >= 70 ? "Výborné fyzikálne myslenie! 👍" : percentage >= 50 ? "Máš dobrý základ. 📚" : "Zvíťazila u teba sedliacka intuícia nad fyzikou. 💡";
            document.getElementById('resultMsg').textContent = percentage >= 90 ? "Nenaletel si na žiadnu bežnú miskoncepciu. Sily a pohyb chápeš naozaj do hĺbky." : percentage >= 70 ? "Väčšinu chytákov si odhalil. Daj si ešte pozor na jemné detaily pri akcii a reakcii alebo dostredivej sile." : percentage >= 50 ? "Základné zákony ovládaš, ale tvoja intuícia ťa niekedy klame. Zameraj sa na to, čo je to výsledná sila." : "Zopakuj si najmä 1. a 3. Newtonov zákon. Vo fyzike neplatí, že väčší alebo ťažší objekt vyhráva, a pohyb nepotrebuje vždy ťah vpred!";
        }
        loadQuestion();
    </script>
