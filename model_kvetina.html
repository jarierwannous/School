<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interaktívny Model</title>
    
    <!-- Načítanie Google model-viewer komponenty cez CDN -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --primary-color: #2E7D32;
            --accent-color: #81C784;
            --text-main: #333333;
            --text-muted: #666666;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --font-main: 'Segoe UI', system-ui, Roboto, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #e8ece9;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* STYLOVANIE HOTSPOTOV (Pulzujúce body) */
        .hotspot {
            display: block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, background-color 0.2s;
        }

        .hotspot::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            border-radius: 50%;
            background-color: var(--primary-color);
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse 1.5s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        .hotspot:hover, .hotspot.active {
            transform: scale(1.2);
            background-color: #FFB300; 
        }
        
        .hotspot.active::after { background-color: #FFB300; }

        /* INFORMAČNÝ PANEL */
        .info-card {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }

        .info-default {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .info-content { display: none; }
        .info-title { color: var(--primary-color); font-size: 1.6rem; margin-bottom: 4px; }
        .info-latin { color: var(--text-muted); font-style: italic; font-size: 1.1rem; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e0e0e0; }
        .info-desc { color: var(--text-main); font-size: 1.05rem; line-height: 1.6; }

        @media (min-width: 768px) {
            .info-card {
                bottom: auto;
                top: 30px;
                left: 30px;
                transform: none;
                width: 350px;
            }
        }
    </style>
</head>
<body>

    <!-- 
        TESTOVACÍ MODEL: Zatiaľ je tu vložený odkaz na verejný model (Astronaut), 
        aby ti to fungovalo hneď bez servera. 
        Ak budeš chcieť vlastný, stačí zmeniť src="https://..." na src="kvet.glb"
    -->
    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/kvet.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1.5"
        exposure="1"
        alt="3D model kvetu (zastúpený testovacím modelom)">
        
        <!-- Upravené súradnice, aby body sedeli na testovací model -->
        <button class="hotspot" slot="hotspot-1" data-position="-0.2 1.6 0.3" data-normal="0 1 0" data-part="receptaculum"></button>
        <button class="hotspot" slot="hotspot-2" data-position="0.3 1.2 0.3" data-normal="1 0 0" data-part="sepala"></button>
        <button class="hotspot" slot="hotspot-3" data-position="-0.3 1.0 0.4" data-normal="-1 0 1" data-part="petala"></button>
        <button class="hotspot" slot="hotspot-4" data-position="0.2 0.8 0.3" data-normal="1 0 1" data-part="stamen"></button>
        <button class="hotspot" slot="hotspot-5" data-position="0 1.4 -0.3" data-normal="0 1 -1" data-part="pistil"></button>

    </model-viewer>

    <!-- INFORMAČNÝ PANEL -->
    <div class="info-card">
        <div id="info-default" class="info-default">
            <strong>Interaktívna biológia (Test)</strong><br><br>
            Klikni na pulzujúci bod pre zobrazenie informácií o časti kvetu. (Zatiaľ zobrazené na testovacom 3D modeli).
        </div>

        <div id="info-content" class="info-content">
            <h2 id="info-title" class="info-title">Názov</h2>
            <div id="info-latin" class="info-latin">Latinum</div>
            <p id="info-desc" class="info-desc">Popis funkcie...</p>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        const flowerData = {
            receptaculum: { sk: "Kvetné lôžko", lat: "Receptaculum", desc: "Zhrubnutá koncová časť stonky, z ktorej vyrastajú ostatné kvetné orgány. Tvorí základňu pre stavbu celého kvetu." },
            sepala: { sk: "Kališné lístky", lat: "Calyx (Sepala)", desc: "Vonkajší obal kvetu. Sú spravidla zelené a prebieha v nich fotosyntéza. Ich primárnou funkciou je ochrana vnútorných častí." },
            petala: { sk: "Korunné lístky", lat: "Corolla (Petala)", desc: "Vnútorný kvetný obal. Svojím pestrým sfarbením a tvarom slúžia na prilákanie opeľovačov (hmyzu, vtákov)." },
            stamen: { sk: "Tyčinka", lat: "Stamen", desc: "Samčí pohlavný orgán kvetu. Skladá sa z tenkej nitky (filamentum) a peľnice (anthera) na vrchole. Tvorí peľové zrná." },
            pistil: { sk: "Piestik", lat: "Pistillum", desc: "Samičí pohlavný orgán. Skladá sa z blizny, čnelky a semenníka, v ktorom sú uložené vajíčka (budúce semená)." }
        };

        const hotspots = document.querySelectorAll('.hotspot');
        const defaultPanel = document.getElementById('info-default');
        const contentPanel = document.getElementById('info-content');
        const titleEl = document.getElementById('info-title');
        const latinEl = document.getElementById('info-latin');
        const descEl = document.getElementById('info-desc');
        const viewer = document.querySelector('model-viewer');

        hotspots.forEach(hotspot => {
            hotspot.addEventListener('click', (event) => {
                viewer.autoRotate = false;
                hotspots.forEach(h => h.classList.remove('active'));
                event.target.classList.add('active');

                const partId = event.target.getAttribute('data-part');
                const data = flowerData[partId];

                if(data) {
                    defaultPanel.style.display = 'none';
                    contentPanel.style.display = 'block';
                    titleEl.textContent = data.sk;
                    latinEl.textContent = data.lat;
                    descEl.textContent = data.desc;
                }
            });
        });

        viewer.addEventListener('click', (event) => {
            if(!event.target.classList.contains('hotspot')) {
                viewer.autoRotate = true;
            }
        });
    </script>
</body>
</html>
