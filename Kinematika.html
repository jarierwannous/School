<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kvíz: Fyzikálne miskoncepcie - Kinematika</title>
    <style>
        :root {
            --primary: #10b981; /* Emerald/Teal color for Kinematics */
            --primary-hover: #059669;
            --bg-color: #ecfdf5;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body, html { height: 100%; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        .progress-container { width: 100%; height: 6px; background-color: #a7f3d0; position: fixed; top: 0; left: 0; z-index: 10; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.4s ease; }
        .app-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        .quiz-card { background: var(--card-bg); width: 100%; border-radius: 16px; padding: 30px 25px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.1); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
        .question-header { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 1.05rem; text-align: left; cursor: pointer; transition: all 0.2s ease; color: var(--text-main); font-weight: 500; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #d1fae5; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
        .option-btn.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1rem; line-height: 1.5; display: none; animation: fadeIn 0.4s ease; }
        .feedback-box.show { display: block; }
        .feedback-box.correct-feedback { background-color: var(--correct-bg); border-left: 5px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect-feedback { background-color: var(--incorrect-bg); border-left: 5px solid var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box b { display: block; margin-bottom: 6px; font-size: 1.1rem; }
        .action-btn { margin-top: 20px; background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; width: 100%; display: none; }
        .action-btn:hover { background-color: var(--primary-hover); }
        .action-btn.show { display: block; animation: fadeIn 0.4s ease; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; margin: 0 auto 30px auto; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); }
        .result-title { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
        .result-msg { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .app-container { padding: 10px; } .quiz-card { padding: 20px 15px; } .question-text { font-size: 1.2rem; } .option-btn { font-size: 0.95rem; padding: 12px 14px; } }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="app-container">
        <div class="quiz-card" id="quizScreen">
            <div class="question-header" id="questionHeader">Otázka 1 / 40</div>
            <div class="question-text" id="questionText">Otázka sa načítava...</div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Ďalšia otázka ➔</button>
        </div>
        <div class="quiz-card result-screen" id="resultScreen">
            <div class="score-circle" id="scoreDisplay">0%</div>
            <div class="result-title" id="resultTitle">Vyhodnotenie</div>
            <div class="result-msg" id="resultMsg">Správa</div>
            <button class="action-btn show" onclick="location.reload()">Spustiť kvíz znova</button>
        </div>
    </div>
    <script>
        const quizData = [{"q": "1. Vyhodíš kameň kolmo nahor. Keď dosiahne najvyšší bod (na okamih zastaví), aké je jeho zrýchlenie?", "options": ["Nulové, pretože kameň stojí.", "Smeruje nahor.", "Smeruje nadol a má hodnotu tiažového zrýchlenia (g).", "Závisí od toho, ako silno si ho vyhodil."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ak je rýchlosť nula, aj zrýchlenie je nula.“ <b>Pravda:</b> V najvyššom bode je rýchlosť (v) na okamih nulová, ale kameň neustále mení svoju rýchlosť (spomaľoval a teraz začne zrýchľovať nadol). Zrýchlenie je po celý čas letu konštantné a smeruje nadol (g)."}, {"q": "2. Auto sa pohybuje po rovnej ceste a jeho zrýchlenie je záporné (-2 m/s²). Čo to určite znamená?", "options": ["Auto spomaľuje.", "Auto cúva (ide dozadu).", "Rýchlosť auta sa mení o 2 m/s každú sekundu v zápornom smere osi.", "Auto ide konštantnou rýchlosťou, ale nesprávnym smerom."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Záporné zrýchlenie vždy znamená brzdenie.“ <b>Pravda:</b> Ak auto cúva (má zápornú rýchlosť) a má záporné zrýchlenie, v skutočnosti zrýchľuje (naberá rýchlosť smerom dozadu). Znamená to len toľko, že vektor zrýchlenia mieri do mínusu."}, {"q": "3. Cyklista ide rýchlosťou 20 km/h. Na okamih prestane šliapať a začne plynulo brzdiť. Aký smer má jeho zrýchlenie?", "options": ["V smere jeho pohybu.", "Proti smeru jeho pohybu.", "Smerom k zemi.", "Nemá zrýchlenie, len stráca rýchlosť."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Zrýchlenie vždy mieri tam, kam sa hýbem.“ <b>Pravda:</b> Ak teleso spomaľuje, vektor zrýchlenia smeruje presne opačne ako vektor rýchlosti (pohybu)."}, {"q": "4. Pustíš z okna (voľný pád) dve železné gule. Jednu len voľne pustíš, druhú hodíš prudko kolmo nadol. Aké majú zrýchlenie počas letu?", "options": ["Hodená guľa má väčšie zrýchlenie.", "Pustená guľa má väčšie zrýchlenie.", "Obe majú presne rovnaké zrýchlenie (g).", "Závisí to od ich hmotnosti."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ak ju hodím silnejšie, bude mať väčšie zrýchlenie.“ <b>Pravda:</b> Hodená guľa má väčšiu *počiatočnú rýchlosť*, ale akonáhle opustí ruku, jej rýchlosť narastá rovnakým tempom (o 9,8 m/s každú sekundu) ako pri tej pustenej. Zrýchlenie je rovnaké."}, {"q": "5. Môže mať auto smer pohybu (rýchlosť) na východ, ale zrýchlenie na západ?", "options": ["Nie, zrýchlenie a pohyb musia byť rovnakým smerom.", "Áno, znamená to, že auto ide na východ, ale spomaľuje.", "Áno, znamená to, že auto cúva na západ.", "Nie, takáto situácia je fyzikálne nemožná."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Objekt sa hýbe tam, kam mieri zrýchlenie.“ <b>Pravda:</b> Zrýchlenie hovorí o tom, ako sa *mení* rýchlosť. Ak ideš na východ a vektor zrýchlenia mieri na západ, auto jednoducho brzdí."}, {"q": "6. Stojíš na semafore. Zasvieti zelená a ty dupneš na plyn. V čase t = 0 s máš rýchlosť 0 km/h. Máš v tomto okamihu zrýchlenie?", "options": ["Nie, lebo rýchlosť je nula.", "Áno, zrýchlenie je nenulové, inak by si sa nikdy nepohol.", "Nie, zrýchlenie vznikne až po prvej sekunde.", "Zrýchlenie je vtedy nekonečné."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Bez rýchlosti nemôže byť zrýchlenie.“ <b>Pravda:</b> Rýchlosť je v danom okamihu nula, ale práve sa *začína meniť*. Táto zmena znamená, že zrýchlenie už existuje (od motora)."}, {"q": "7. Pustíš loptičku z výšky 5 metrov a spadne za 1 sekundu. Za aký čas by dopadla, keby si ju pustil z výšky 10 metrov?", "options": ["Presne 2 sekundy.", "Menej ako 2 sekundy.", "Viac ako 2 sekundy.", "Rovnako, 1 sekundu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Dvojnásobná dráha = dvojnásobný čas.“ <b>Pravda:</b> Pri voľnom páde (rovnomerne zrýchlený pohyb) dráha rastie s *druhou mocninou* času (s = 1/2 gt²). Loptička stále naberá rýchlosť, takže druhých 5 metrov preletí oveľa rýchlejšie ako prvých 5 metrov."}, {"q": "8. Pustíš z mosta naraz dve loptičky s odstupom 1 sekundy (najprv prvú, o sekundu neskôr druhú). Čo sa deje so vzdialenosťou medzi nimi počas pádu?", "options": ["Vzdialenosť zostáva rovnaká (zodpovedá 1 sekunde pádu).", "Vzdialenosť sa zmenšuje, lebo druhá loptička dobieha prvú.", "Vzdialenosť sa neustále zväčšuje.", "Loptičky padajú vedľa seba."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Časový odstup = konštantná vzdialenosť.“ <b>Pravda:</b> Prvá loptička padá dlhšie, má teda vyššiu rýchlosť ako druhá. Pretože prvá ide rýchlejšie, neustále druhej loptičke „uteká“ a vzdialenosť medzi nimi rastie."}, {"q": "9. Auto zrýchľuje z 0 na 100 km/h za 10 sekúnd. Potom ide konštantnou rýchlosťou 100 km/h ďalších 10 sekúnd. Kedy bolo zrýchlenie najväčšie?", "options": ["V prvých 10 sekundách.", "V druhých 10 sekundách.", "Bolo stále rovnaké.", "V čase t = 10 s."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Vysoká rýchlosť znamená veľké zrýchlenie.“ <b>Pravda:</b> Zrýchlenie existuje len pri zmene rýchlosti. V druhých 10 sekundách ide auto rýchlo (100 km/h), ale zrýchlenie je NULA."}, {"q": "10. Výťah sa rozbieha smerom nahor (zrýchľuje). Potom ide plynulo (konštantnou rýchlosťou). Aký je smer zrýchlenia, keď sa pred najvyšším poschodím začne spomaľovať?", "options": ["Nahor.", "Nadol.", "Do strán.", "Nemá zrýchlenie, len spomaľuje."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Výťah ide hore, takže zrýchlenie mieri hore.“ <b>Pravda:</b> Pri spomaľovaní nahor musí vektor zrýchlenia pôsobiť proti pohybu, teda nadol (preto sa vtedy vo výťahu cítime ľahší)."}, {"q": "11. Máš graf závislosti DRÁHY od ČASU (s-t graf). Ako v ňom vyzerá auto, ktoré stojí na parkovisku?", "options": ["Je to čiara stúpajúca nahor.", "Je to klesajúca čiara.", "Je to vodorovná čiara (rovnobežná s osou času).", "Je to bod v počiatku (0,0) a graf ďalej nepokračuje."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ak niečo stojí, graf je prázdny alebo klesá.“ <b>Pravda:</b> Čas plynie ďalej, ale poloha (dráha) sa nemení. Preto je to vodorovná čiara na nejakej hodnote na osi y."}, {"q": "12. V s-t grafe (dráha/čas) vidíš dve priamky opisujúce dve autá. Priamka auta A je strmšia ako priamka auta B. Čo to znamená?", "options": ["Auto A má menšiu rýchlosť.", "Auto A má väčšiu rýchlosť.", "Auto A má väčšie zrýchlenie.", "Auto A išlo do kopca."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Graf ukazuje tvar cesty (kopce).“ <b>Pravda:</b> V s-t grafe určuje strmosť (sklon) čiary rýchlosť. Čím strmšia čiara, tým viac metrov auto prejde za sekundu, takže ide rýchlejšie."}, {"q": "13. V s-t grafe (dráha/čas) sa pretne čiara auta A a čiara auta B. Čo tento bod pretnutia v skutočnosti znamená?", "options": ["V tom momente majú autá rovnakú rýchlosť.", "V tom momente do seba narazili alebo sa predbehli.", "Jedno auto práve zrýchľuje a druhé spomaľuje.", "V tom momente zastali."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Pretnutie v grafe znamená rovnakú rýchlosť.“ <b>Pravda:</b> Osi sú Dráha a Čas. Ak sa čiary pretnú, znamená to, že v tom istom čase (os x) sú na tom istom mieste (os y). Teda sa stretli/predbehli."}, {"q": "14. Prejdime na graf RÝCHLOSTI od ČASU (v-t graf). Ako v ňom vyzerá auto, ktoré ide stálou rýchlosťou 50 km/h?", "options": ["Je to šikmá čiara stúpajúca nahor.", "Je to vodorovná čiara vo výške 50.", "Je to priamka klesajúca k nule.", "Nulová čiara na osi x."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Vodorovná čiara vždy znamená státie.“ <b>Pravda:</b> Toto je v-t graf! Osa y je rýchlosť. Ak je čiara vodorovne na 50-tke, znamená to, že rýchlosť je stále 50. Auto nezrýchľuje, ide rovnomerne."}, {"q": "15. V grafe RÝCHLOSTI od ČASU (v-t graf) sa pretne čiara auta A a čiara auta B. Čo to znamená?", "options": ["Autá sa práve predbehli (sú na rovnakom mieste).", "Autá do seba narazili.", "V tomto jedinom okamihu majú autá úplne rovnakú rýchlosť.", "Jedno auto zrýchľuje a druhé cúva."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Pretnutie grafov = fyzické stretnutie áut.“ <b>Pravda:</b> Vo v-t grafe os y ukazuje rýchlosť. Pretnutie znamená, že v tom čase sa ich tachometre zhodujú. Fyzicky môžu byť kilometre od seba!"}, {"q": "16. Máš v-t graf (rýchlosť/čas) s priamkou stúpajúcou šikmo nahor z počiatku. Čo určuje SKLON tejto priamky?", "options": ["Prejdenú dráhu.", "Zrýchlenie auta.", "Priemernú rýchlosť.", "Odpor vzduchu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Strmosť vo v-t grafe je rýchlosť.“ <b>Pravda:</b> Zmena rýchlosti za čas (v/t) je definícia zrýchlenia. Strmší svah vo v-t grafe znamená prudšie zrýchľovanie."}, {"q": "17. Ako v v-t grafe (rýchlosť/čas) zistíš prejdenú dráhu (koľko metrov auto prešlo)?", "options": ["Pozrieš sa na najvyššiu hodnotu na osi y.", "Odčítaš hodnotu y na konci čiary.", "Vypočítaš PLOCHU (obsah) obrazca pod čiarou grafu.", "Pozrieš sa, kde sa graf dotýka osi x."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Dráha sa z v-t grafu zistiť nedá, len prečítať z osí.“ <b>Pravda:</b> Dráha s = v * t. Vynásobenie osi y (rýchlosť) a osi x (čas) je geometricky výpočet plochy pod grafom (obdĺžnika alebo trojuholníka)."}, {"q": "18. Vo v-t grafe priamka klesne pod vodorovnú os času (rýchlosť ide do mínusu). Čo sa deje?", "options": ["Auto spomaľuje až do zastavenia.", "Auto zastavilo.", "Auto sa začalo pohybovať opačným smerom (cúva).", "Auto sa pokazilo a stráca zrýchlenie."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Graf pod osou znamená spomaľovanie.“ <b>Pravda:</b> Hodnota na osi y je rýchlosť. Keď pretne nulu, auto zastaví. Hodnota v mínuse znamená, že auto ide smerom dozadu."}, {"q": "19. Ktorý graf popisuje voľný pád loptičky (od momentu pustenia po dopad)?", "options": ["s-t graf je priamka stúpajúca nahor.", "v-t graf je priamka stúpajúca šikmo nahor (resp. nadol do mínusu).", "s-t graf je vodorovná čiara.", "v-t graf je parabola."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Pri padaní je zrýchlenie parabola.“ <b>Pravda:</b> Zrýchlenie (g) je konštantné. Preto rýchlosť (v) rastie rovnomerne s časom (v = g*t), čo je v grafe priamka. Parabola by to bola v s-t grafe."}, {"q": "20. Žiak nakreslí s-t graf (dráha/čas), kde čiara na chvíľu cúvne v čase dozadu a vytvorí slučku. Prečo je to vo fyzike nemožné?", "options": ["Lebo autá nevedia cúvať v takýchto grafoch.", "Lebo dráha nemôže klesať.", "Lebo by to znamenalo cestovanie v čase dozadu.", "Lebo slučka znamená zrýchlenie vyššie ako rýchlosť svetla."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ak sa na trati otočím a idem späť, slučka v grafe vyzerá rovnako.“ <b>Pravda:</b> Os x je čas, a ten ide vždy len dopredu (doprava). Ak auto cúva, graf ide smerom nadol na osi y, ale stále doprava na osi x. Krivka sa nikdy nesmie vrátiť doľava."}, {"q": "21. Auto ide konštantnou (stálou) rýchlosťou 40 km/h do kruhového objazdu. Koná rovnomerne zrýchlený pohyb?", "options": ["Nie, lebo jeho rýchlosť je stále 40 km/h.", "Nie, to by muselo brzdiť.", "Áno, koná zrýchlený pohyb, lebo neustále mení SMER rýchlosti.", "Nie, koná rovnomerný pohyb."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rovnaké číslo na tachometri = žiadne zrýchlenie.“ <b>Pravda:</b> Rýchlosť je vektor (má veľkosť aj smer). Zmena smeru znamená zmenu rýchlosti. Ak sa rýchlosť mení, existuje zrýchlenie (dostredivé zrýchlenie)."}, {"q": "22. Aký smer má zrýchlenie auta, ktoré krúži po kruhovom objazde stálou rýchlosťou 40 km/h?", "options": ["V smere jazdy auta (dopredu).", "Smerom von z kruhu (odstredivo).", "Presne do STREDU kruhového objazdu.", "Nemá zrýchlenie."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Zrýchlenie pri otáčaní ťahá von.“ <b>Pravda:</b> Toto je dostredivé zrýchlenie. Aby sa vektor rýchlosti neustále zahýbal, zrýchlenie musí smerovať kolmo na dráhu – teda vždy do stredu kružnice."}, {"q": "23. Dve bodky sú nakreslené na hrajúcej gramofónovej platni. Bodka A je blízko stredu, bodka B je na vonkajšom okraji. Čo majú obe bodky rovnaké?", "options": ["Obvodovú rýchlosť (m/s).", "Dostredivé zrýchlenie.", "Uhlovú rýchlosť (počet otáčok za sekundu).", "Prejdenú dráhu v metroch."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Na platni sa všetko točí rovnakou rýchlosťou (aj v m/s).“ <b>Pravda:</b> Platňa je pevná, takže obe bodky urobia jednu otáčku za rovnaký čas (rovnaká uhlová rýchlosť). Bodka B na okraji však musí prejsť väčší kruh, takže jej obvodová rýchlosť v m/s je väčšia."}, {"q": "24. Ktorá bodka z predchádzajúcej otázky (A v strede, B na okraji) má VÄČŠIU obvodovú (lineárnu) rýchlosť v m/s?", "options": ["Bodka A v strede.", "Bodka B na okraji.", "Obe majú rovnakú.", "Závisí to od platne."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „V strede sa to točí najrýchlejšie.“ <b>Pravda:</b> Bodka na okraji musí za jednu otáčku (napr. za 1 sekundu) opísať celý veľký obvod (napr. 1 meter). Bodka v strede opíše za ten istý čas len malinký kruh (napr. 1 cm). B je oveľa rýchlejšia (v = r * ω)."}, {"q": "25. Perioda (T) rovnomerného pohybu po kružnici nám hovorí:", "options": ["Koľko otáčok teleso urobí za jednu sekundu.", "Koľko sekúnd trvá telesu urobiť presne jednu celú otáčku.", "Akú vzdialenosť teleso prejde za jednu otáčku.", "Aká je veľkosť rýchlosti v m/s."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Perióda a frekvencia sú to isté.“ <b>Pravda:</b> Perióda (T) je ČAS jednej otáčky (v sekundách). Frekvencia (f) je POČET otáčok za sekundu (v Hertzoch). Platí vzťah f = 1/T."}, {"q": "26. Ak sa frekvencia otáčania kolesa ZDVOJNÁSOBÍ (z 1 Hz na 2 Hz), čo sa stane s jeho obvodovou rýchlosťou?", "options": ["Zostane rovnaká.", "Zmenší sa na polovicu.", "Zdvojnásobí sa.", "Zvýši sa štvornásobne."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rýchlosť nesúvisí lineárne s frekvenciou.“ <b>Pravda:</b> Vzorec pre obvodovú rýchlosť je v = 2*π*r*f. Rýchlosť je priamo úmerná frekvencii. Dvakrát viac otáčok za sekundu = dvakrát väčšia rýchlosť."}, {"q": "27. V akom smere by odletela iskra od rotujúceho brúsneho kotúča?", "options": ["Do stredu kotúča.", "V smere polomeru priamo von.", "Po dotyčnici ku kotúču (kolmo na polomer).", "Náhodným smerom."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Iskry letia priamo od stredu von.“ <b>Pravda:</b> Iskra mala obvodovú rýchlosť, ktorá má smer dotyčnice ku kružnici. Keď sa uvoľní, letí podľa zotrvačnosti rovno – v smere tejto dotyčnice."}, {"q": "28. Aký je rozdiel medzi rýchlosťou (v) a uhlovou rýchlosťou (ω)?", "options": ["Nie je v nich rozdiel.", "Rýchlosť je v m/s (ako rýchlo ubieha dráha), uhlová rýchlosť je v rad/s (ako rýchlo sa mení uhol).", "Uhlová rýchlosť je vždy väčšia.", "Rýchlosť sa meria v stupňoch."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Otáčky za minútu a km/h sú rovnaký typ rýchlosti.“ <b>Pravda:</b> Uhlová rýchlosť udáva uhol za čas (točenie), zatiaľ čo klasická rýchlosť udáva dráhu za čas (metre). Sú prepojené polomerom (v = r*ω)."}, {"q": "29. Koleso auta má polomer 0,5 metra. Ak sa koleso otočí bez prešmykovania presne raz dookola, akú vzdialenosť prejde auto?", "options": ["0,5 metra.", "1 meter.", "π metrov (cca 3,14 m).", "2 metry."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Vzdialenosť je rovná priemeru.“ <b>Pravda:</b> Za jednu otáčku sa po ceste 'odvalí' celý obvod kolesa. Obvod O = 2*π*r. Pre r = 0,5 m je obvod 2*π*0,5 = π metrov."}, {"q": "30. Má dostredivé zrýchlenie vplyv na ZMENU VEĽKOSTI obvodovej rýchlosti (či auto zrýchľuje v km/h)?", "options": ["Áno, dostredivé zrýchlenie auto zrýchľuje.", "Nie, dostredivé zrýchlenie mení len SMER rýchlosti, nie jej veľkosť.", "Áno, dostredivé zrýchlenie auto spomaľuje.", "Závisí to od polomeru zákruty."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Zrýchlenie musí meniť hodnotu tachometra.“ <b>Pravda:</b> Ak zrýchlenie pôsobí kolmo na rýchlosť (ako to dostredivé), nedokáže rýchlosť ani zväčšiť, ani zmenšiť. Iba ju „ohýba“ do kruhu."}, {"q": "31. Cestuješ do mesta A (60 km ďaleko) rýchlosťou 60 km/h. Naspäť domov ideš pomalšie, rýchlosťou 40 km/h. Aká je tvoja priemerná rýchlosť (veľkosť) za celú cestu tam aj späť?", "options": ["Presne 50 km/h.", "Menej ako 50 km/h (48 km/h).", "Viac ako 50 km/h.", "0 km/h."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Priemerná rýchlosť je aritmetický priemer dvoch rýchlostí.“ <b>Pravda:</b> Cesta späť pomalšou rýchlosťou (40 km/h) trvala dlhšie (1,5 h) ako cesta tam (1 h). Keďže si pomalšou rýchlosťou išiel viac času, priemerná rýchlosť (celková dráha 120 km / celkový čas 2,5 h) klesne pod 50 km/h, presne na 48 km/h."}, {"q": "32. Bežec zabehne na 400 m dlhej kruhovej dráhe presne jeden celok (1 kolo) a zastaví presne na štarte. Aká je jeho prejdená DRÁHA a aké POSUNUTIE (vektor)?", "options": ["Dráha 400 m, posunutie 400 m.", "Dráha 400 m, posunutie 0 m.", "Dráha 0 m, posunutie 400 m.", "Obe sú 0 m."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Dráha a posunutie sú synonymá.“ <b>Pravda:</b> Dráha (skalár) je celková vzdialenosť, ktorú nohy prešli (400 m). Posunutie (vektor) ukazuje priamou čiarou od štartu do cieľa. Keďže štart a cieľ sú ten istý bod, posunutie je 0 metrov."}, {"q": "33. V nadväznosti na predchádzajúcu otázku: Aký je vektor jeho priemernej (vektorovej) rýchlosti za toto 1 kolo?", "options": ["Je rovný priemernej hodnote tachometra.", "Je 0 m/s.", "Je 400 m/s.", "Závisí od času behu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Vektorová priemerná rýchlosť je to isté čo priemerná veľkosť rýchlosti.“ <b>Pravda:</b> Vektorová rýchlosť sa počíta ako celkové Posunutie / čas. Keďže posunutie je 0, vektorová priemerná rýchlosť pre uzavretú slučku je vždy 0."}, {"q": "34. Ideš vo vlaku, ktorý sa hýbe stálou rýchlosťou 100 km/h. Vyskočíš do vzduchu (kolmo hore). Kde dopadneš?", "options": ["Dopadneš o kúsok dozadu, lebo vlak ti ušiel.", "Dopadneš presne na to isté miesto na podlahe, odkiaľ si vyskočil.", "Dopadneš dopredu.", "Závisí to od hmotnosti tvojich topánok."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Pri skoku strácam rýchlosť vlaku.“ <b>Pravda:</b> Vo chvíli výskoku má tvoje telo horizontálnu rýchlosť 100 km/h, rovnako ako vlak. Kým si vo vzduchu, zotrvačnosťou letíš dopredu s vlakom, takže dopadneš presne na to isté miesto (Relativita pohybu)."}, {"q": "35. Sedíš vo vlaku (100 km/h). Vedľa teba na koľaji opačným smerom prechádza iný vlak (100 km/h). Akou rýchlosťou sa voči tebe (z tvojho okna) hýbe ten druhý vlak?", "options": ["100 km/h", "0 km/h", "200 km/h", "50 km/h"], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Každý objekt má svoju absolútnu rýchlosť bez ohľadu na pozorovateľa.“ <b>Pravda:</b> Rýchlosť je relatívna. Ak idete proti sebe, vaše rýchlosti sa z pohľadu jedného z vás sčítavajú (100 + 100 = 200 km/h)."}, {"q": "36. Na tachometri v aute vidíš číslo 50 km/h. Akú fyzikálnu veličinu ti presne ukazuje?", "options": ["Priemernú rýchlosť.", "Okamžitú (skalárnu) rýchlosť.", "Posunutie.", "Zmenu zrýchlenia."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Tachometer ukazuje priemernú rýchlosť mojej cesty.“ <b>Pravda:</b> Tachometer ukazuje len veľkosť rýchlosti presne v tomto jedinom okamihu (okamžitá rýchlosť). Nestarajú ho smery (vektor) ani tvoja minulosť."}, {"q": "37. Zhodíš mincu vo vagóne, ktorý rovnomerne zrýchľuje (rozbieha sa). Ako vyzerá pád mince pri pohľade tvojimi očami (človeka stojaceho vo vagóne)?", "options": ["Minca padá kolmo dole k tvojim nohám.", "Minca padá po šikmej dráhe dozadu (k zadnej stene vagóna).", "Minca padá dopredu.", "Minca sa vznáša."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Minca padne vždy tam, kde bola pustená.“ <b>Pravda:</b> Kým minca padá (jej horizontálna rýchlosť zostáva rovnaká ako v momente pustenia), vagón okolo nej neustále zrýchľuje dopredu. Vagón jej teda 'utečie' a minca z tvojho pohľadu dopadne kúsok dozadu."}, {"q": "38. Auto A a auto B idú po tej istej diaľnici rovnako rýchlo (130 km/h). Auto A je však 1 km pred autom B. Pohybuje sa auto A voči autu B?", "options": ["Áno, pohybuje sa rýchlosťou 130 km/h.", "Nie, voči autu B stojí (rýchlosť 0 km/h).", "Áno, ale pohybuje sa rýchlosťou len 1 km/h.", "Áno, voči autu B sa pohybuje rýchlosťou 260 km/h."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Ak sa hýbem voči zemi, hýbem sa voči všetkému.“ <b>Pravda:</b> Pretože majú rovnakú rýchlosť aj smer, ich vzájomná vzdialenosť sa nemení. V ich vzájomnej (relatívnej) vzťažnej sústave je ich rýchlosť 0."}, {"q": "39. Kráčaš 3 km na SEVER a potom 4 km na VÝCHOD. Aká je tvoja celková prejdená dráha (s) a aká je veľkosť tvojho posunutia (Δr)?", "options": ["Dráha 7 km, posunutie 7 km.", "Dráha 5 km, posunutie 7 km.", "Dráha 7 km, posunutie 5 km.", "Obe sú 5 km."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Súčet prejdených kilometrov je vzdialenosť od štartu.“ <b>Pravda:</b> Dráha je jednoduchý súčet krokov (3 + 4 = 7 km). Posunutie je priama vzdušná čiara. Keďže cesty tvoria pravouhlý trojuholník, podľa Pytagorovej vety je posunutie sqrt(3² + 4²) = 5 km."}, {"q": "40. Čím sa kinematika zásadne líši od dynamiky?", "options": ["Kinematika sa zaoberá pohybom mikročastíc, dynamika makroskopických telies.", "Kinematika skúma IBA to, AKO sa telesá pohybujú (dráha, rýchlosť, zrýchlenie), zatiaľ čo dynamika skúma PREČO sa pohybujú (sily, Newtonove zákony).", "Kinematika skúma trenie, dynamika gravitáciu.", "Nie je medzi nimi žiadny rozdiel, je to len starší názov."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Je to tá istá fyzika s iným názvom.“ <b>Pravda:</b> Kinematika je 'geometria pohybu'. Zaujíma ju len tvar trajektórie a výpočty t, s, v, a. V kinematike vôbec neriešime hmotnosť, sily ani energiu."}];
        let currentQuestion = 0; let score = 0;
        const questionHeader = document.getElementById('questionHeader');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackBox = document.getElementById('feedbackBox');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');

        function loadQuestion() {
            feedbackBox.className = 'feedback-box'; feedbackBox.innerHTML = '';
            nextBtn.classList.remove('show'); optionsContainer.innerHTML = '';
            const q = quizData[currentQuestion];
            questionHeader.textContent = `Otázka ${currentQuestion + 1} z ${quizData.length}`;
            questionText.innerHTML = q.q;
            progressBar.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerHTML = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = quizData[currentQuestion]; const allBtns = optionsContainer.children;
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.answer) allBtns[i].classList.add('correct');
            }
            if (selectedIndex === q.answer) {
                score++;
                feedbackBox.className = 'feedback-box show correct-feedback';
                feedbackBox.innerHTML = `<b>Správne! 🎉</b> ${q.explanation}`;
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackBox.className = 'feedback-box show incorrect-feedback';
                feedbackBox.innerHTML = `<b>Nesprávne.</b> ${q.explanation}`;
            }
            if (currentQuestion === quizData.length - 1) nextBtn.textContent = 'Zobraziť výsledky ➔';
            nextBtn.classList.add('show');
            setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) loadQuestion(); else showResults();
        }

        function showResults() {
            progressBar.style.width = '100%'; quizScreen.style.display = 'none'; resultScreen.style.display = 'block';
            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreDisplay').innerHTML = `<span>${score}</span><span style="font-size: 1.2rem; opacity: 0.8">/${quizData.length}</span>`;
            document.getElementById('resultTitle').textContent = percentage >= 90 ? "Kinematický expert! 🚀" : percentage >= 70 ? "Veľmi dobrá práca! 👍" : percentage >= 50 ? "Dobrý základ. 📚" : "Pozor na chytáky! 💡";
            document.getElementById('resultMsg').textContent = percentage >= 90 ? "Skvelé! Dokonale rozlišuješ medzi dráhou, rýchlosťou a zrýchlením a grafy čítaš ako profesionál." : percentage >= 70 ? "Väčšinu chytákov si zvládol. Daj si pozor najmä na v-t grafy, pri ktorých strmosť určuje zrýchlenie, a na pohyb po kružnici." : percentage >= 50 ? "Základné pojmy chápeš, ale mýliš si rýchlosť so zrýchlením (najmä ak teleso stojí alebo ide rovnomerne po kružnici)." : "Zopakuj si rozdiely medzi s-t a v-t grafmi. Pamätaj: zrýchlenie sa stará len o ZMENU rýchlosti, nie o to, ako rýchlo ideš!";
        }
        loadQuestion();
    </script>
