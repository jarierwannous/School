<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kvíz: Fyzikálne miskoncepcie - Mechanika tuhého telesa</title>
    <style>
        :root {
            --primary: #f59e0b; /* Amber/Orange color for Solid Body Mechanics */
            --primary-hover: #d97706;
            --bg-color: #fffbeb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body, html { height: 100%; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        .progress-container { width: 100%; height: 6px; background-color: #fde68a; position: fixed; top: 0; left: 0; z-index: 10; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.4s ease; }
        .app-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        .quiz-card { background: var(--card-bg); width: 100%; border-radius: 16px; padding: 30px 25px; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.1); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
        .question-header { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 1.05rem; text-align: left; cursor: pointer; transition: all 0.2s ease; color: var(--text-main); font-weight: 500; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #fef3c7; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
        .option-btn.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1rem; line-height: 1.5; display: none; animation: fadeIn 0.4s ease; }
        .feedback-box.show { display: block; }
        .feedback-box.correct-feedback { background-color: var(--correct-bg); border-left: 5px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect-feedback { background-color: var(--incorrect-bg); border-left: 5px solid var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box b { display: block; margin-bottom: 6px; font-size: 1.1rem; }
        .action-btn { margin-top: 20px; background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; width: 100%; display: none; }
        .action-btn:hover { background-color: var(--primary-hover); }
        .action-btn.show { display: block; animation: fadeIn 0.4s ease; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; margin: 0 auto 30px auto; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3); }
        .result-title { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
        .result-msg { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .app-container { padding: 10px; } .quiz-card { padding: 20px 15px; } .question-text { font-size: 1.2rem; } .option-btn { font-size: 0.95rem; padding: 12px 14px; } }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="app-container">
        <div class="quiz-card" id="quizScreen">
            <div class="question-header" id="questionHeader">Otázka 1 / 40</div>
            <div class="question-text" id="questionText">Otázka sa načítava...</div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Ďalšia otázka ➔</button>
        </div>
        <div class="quiz-card result-screen" id="resultScreen">
            <div class="score-circle" id="scoreDisplay">0%</div>
            <div class="result-title" id="resultTitle">Vyhodnotenie</div>
            <div class="result-msg" id="resultMsg">Správa</div>
            <button class="action-btn show" onclick="location.reload()">Spustiť kvíz znova</button>
        </div>
    </div>
    <script>
        const quizData = [{"q": "1. Dvere sa otvárajú najľahšie, keď na ne tlačíš čo najďalej od pántov. Prečo?", "options": ["Lebo na kraji dverí pôsobí menšie trenie vzduchu.", "Lebo tým zväčšuješ rameno sily, a teda aj otáčavý účinok (moment sily).", "Lebo na kraji dverí dokážeš vyvinúť fyzicky väčšiu silu.", "Lebo pánty sú takto odľahčené od gravitácie."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Nezáleží kde tlačím, dôležité je ako silno.“ <b>Pravda:</b> Otáčavý účinok (moment sily M = F * r) závisí nielen od sily (F), ale aj od vzdialenosti od osi otáčania – ramena sily (r). Väčšia vzdialenosť znamená väčší otáčavý účinok pri rovnakej námahe."}, {"q": "2. Zatlačíš na dvere silou 100 N presne v mieste, kde sú pánty (os otáčania). Čo sa stane?", "options": ["Dvere sa otvoria, ale veľmi pomaly.", "Dvere sa otvoria najrýchlejšie, lebo sila ide priamo do mechanizmu.", "Dvere sa vôbec nezačnú otáčať.", "Závisí to od toho, z akého sú materiálu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Akákoľvek sila na teleso spôsobí jeho pohyb/rotáciu.“ <b>Pravda:</b> Ak sila prechádza priamo osou otáčania, rameno sily je nula (r = 0). Moment sily je teda nula (100 N * 0 m = 0) a teleso sa nezačne otáčať."}, {"q": "3. Uťahuješ maticu kľúčom. Záleží na tom, pod akým uhlom ťaháš za kľúč?", "options": ["Nie, uhol je jedno, dôležitá je len veľkosť sily a dĺžka kľúča.", "Áno, najväčší moment sily dosiahneš, ak ťaháš kľúč presne kolmo (pod uhlom 90°).", "Áno, najlepšie je ťahať ho pod uhlom 45°.", "Áno, najlepšie je ťahať ho vodorovne so zemou."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Sila a vzdialenosť stačia na určenie rotácie.“ <b>Pravda:</b> Moment sily závisí aj od uhla (M = F * r * sin α). Ak ťaháš kolmo (sin 90° = 1), celá tvoja sila ide do otáčania. Ak by si ťahal kľúč rovnobežne s ním (smerom od matice), neotočíš ho vôbec."}, {"q": "4. Dve deti sedia na hojdačke (páke). Jedno váži 20 kg, druhé 40 kg. Môže byť hojdačka v rovnováhe a nepreklápať sa?", "options": ["Nie, ťažšie dieťa vždy klesne dole.", "Áno, ak si ľahšie dieťa sadne presne doprostred.", "Áno, ak ťažšie dieťa sedí dvakrát BLIŽŠIE k osi otáčania ako ľahšie dieťa.", "Áno, ak obaja sedia rovnako ďaleko od stredu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ťažšia strana vždy klesne.“ <b>Pravda:</b> Rovnováha na páke nastáva, keď sa vyrovnajú momenty síl (M1 = M2), teda F1*r1 = F2*r2. Ak má niekto 2x väčšiu hmotnosť (silu), musí sedieť 2x bližšie (rameno), aby bol súčin rovnaký."}, {"q": "5. Snažíš sa povoliť zhrdzavenú skrutku. Nasadíš kľúč, ale tvoja sila nestačí. Ak nasadíš na kľúč dlhú kovovú rúrku a zatlačíš na jej koniec rovnakou silou, čo sa zmení?", "options": ["Zvýšiš tým svoju silu.", "Znížiš trenie v skrutke.", "Zväčšíš moment sily vďaka dlhšiemu ramenu.", "Nič sa nezmení, rúrka len zavadzia."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rúrka mi dáva fyzicky viac sily.“ <b>Pravda:</b> Tvoja svalová sila je stále rovnaká. Predĺžením páky (rúrkou) si zväčšil rameno sily (r), čím si znásobil otáčavý účinok (moment sily), ktorý pôsobí na skrutku."}, {"q": "6. Na bicykli prehadzuješ na ľahší prevod (šliapanie do strmého kopca). Reťaz sa vzadu presunie na VÄČŠIE ozubené koleso. Prečo sa ti zrazu šliape ľahšie?", "options": ["Lebo väčšie koleso sa točí rýchlejšie.", "Lebo väčšie koleso má menšiu hmotnosť.", "Lebo reťaz ťahá zadné koleso na väčšom ramene sily, čím pri rovnakej sile vytvára väčší otáčavý moment.", "Lebo reťaz je takto voľnejšia."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Prevody sú len o veľkosti kolesa, nie o pákach.“ <b>Pravda:</b> Ozubené koleso funguje ako páka. Keď reťaz pôsobí na zadné koleso vo väčšej vzdialenosti od osi (väčšie ozubené koliesko), vytvára väčší moment sily na prekonanie odporu kopca. Tvoje nohy tak musia prekonávať menší odpor."}, {"q": "7. Pôsobíš silou na okraj kolesa bicykla tak, že vektor sily mieri presne do jeho stredu (do osi). Aký bude otáčavý účinok?", "options": ["Maximálny, lebo sila mieri k osi.", "Polovičný.", "Koleso sa začne točiť dozadu.", "Nulový. Koleso sa neotočí."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Sila pôsobiaca na teleso ním vždy dokáže pohnúť do strany.“ <b>Pravda:</b> Ak smer sily (vektor) prechádza osou otáčania, táto sila koleso iba tlačí do ložiska, ale nemá žiadne rameno (kolmú vzdialenosť od osi), takže nevytvára rotáciu."}, {"q": "8. Kde by si mal umiestniť kľučku na ťažkých dverách trezoru, aby sa otvárali čo najľahšie?", "options": ["Presne do stredu dverí z estetických dôvodov.", "Čo najbližšie k pántom.", "Čo najďalej od pántov (na opačný okraj).", "Kľučka nemá vplyv na náročnosť otvárania dverí."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Umiestnenie kľučky je len vec dizajnu.“ <b>Pravda:</b> Aby bol moment sily čo najväčší pri čo najmenšej ľudskej námahe, musí byť rameno sily čo najdlhšie. Preto sú kľučky vždy na opačnej strane dverí, než sú pánty."}, {"q": "9. Tvrdenie: 'Ťažisko (hmotný stred) telesa sa musí vždy nachádzať priamo v materiáli, z ktorého je teleso vyrobené.'", "options": ["Áno, inak by to nebol stred telesa.", "Nie. Napríklad ťažisko prsteňa alebo podkovy sa nachádza vo voľnom priestore (vo vzduchu) mimo materiálu.", "Áno, výnimkou sú len plyny.", "Nie, ale ťažisko musí aspoň jemne lícovať povrch telesa."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Ťažisko je konkrétny bod hmoty.“ <b>Pravda:</b> Ťažisko je matematický bod reprezentujúci priemerné rozloženie hmotnosti. Pri dutých alebo zakrivených predmetoch (prsteň, obruč, podkova) tento bod leží úplne mimo samotného materiálu telesa."}, {"q": "10. Vezmeš bejzbalovú pálku (na jednom konci je tenká, na druhom hrubá) a nájdeš jej ťažisko tým, že ju vyvážiš na prste. Potom pálku v tomto bode presne rozrežeš na dve časti. Ktorá časť bude mať väčšiu hmotnosť?", "options": ["Obidve časti budú mať presne rovnakú hmotnosť (sú vyvážené).", "Hrubšia/kratšia časť bude ťažšia.", "Tenšia/dlhšia časť bude ťažšia.", "Ťažisko pálky je presne v jej geometrickom strede, takže budú rovnako ťažké."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Ťažisko delí objekt na dve rovnako ťažké polovice.“ <b>Pravda:</b> Ťažisko vyrovnáva MOMENTY SÍL, nie hmotnosti. Tenká časť je dlhšia (má väčšie rameno), takže jej stačí menšia hmotnosť na to, aby vyvážila hrubú, ťažšiu, ale krátku časť pálky."}, {"q": "11. Stojíš s nohami pri sebe chrbtom a pätami opretý rovno o stenu. Tvojou úlohou je predkloniť sa a dotknúť sa špičiek nôh bez toho, aby si pokrčil kolená. Čo sa stane?", "options": ["Bez problémov sa ich dotkneš.", "Tvoje kolená sa automaticky ohnú proti tvojej vôli.", "Spadneš dopredu, pretože tvoje ťažisko sa posunie pred tvoju plochu opory (chodidlá) a nemôžeš to vykompenzovať posunutím zadku dozadu.", "Dotkneš sa ich, ale len ak máš dlhé ruky."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Človek udrží rovnováhu vždy, ak má svalovú silu.“ <b>Pravda:</b> Aby človek stál, zvislica z jeho ťažiska musí prechádzať plochou opory (chodidlami). Pri bežnom predklone posúvame panvu dozadu. Ak ti stena bráni posunúť panvu dozadu, ťažisko vyjde pred špičky a ty gravitáciou nevyhnutne prepadneš vpred."}, {"q": "12. Kde sa nachádza ťažisko úplne symetrickej, homogénnej drevenej gule?", "options": ["Presne v jej geometrickom strede.", "Mierne posunuté nadol kvôli gravitácii.", "Na jej povrchu, v bode dotyku so zemou.", "Gule nemajú jedno ťažisko, ťažisko sa mení podľa toho, ako sa guľa kotúľa."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Ťažisko klesá dole.“ <b>Pravda:</b> Ak je teleso geometricky symetrické a je všade z rovnako hustého materiálu (homogénne), jeho ťažisko je vždy totožné s jeho geometrickým stredom."}, {"q": "13. Prečo sú pretekárske autá (Formuly) stavané tak nízko k zemi?", "options": ["Aby vyzerali agresívnejšie.", "Aby znížili ťažisko čo najbližšie k ceste, čím sa enormne zvyšuje ich stabilita v zákrutách proti prevráteniu.", "Aby kolesá mali kratšie nápravy.", "Aby sa znížilo statické trenie pneumatík."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Výška auta ovplyvňuje len aerodynamiku.“ <b>Pravda:</b> Čím je ťažisko nižšie, tým ťažšie je ho pri naklonení telesa (alebo pri odstredivej sile v zákrute) 'pretlačiť' cez hranu plochy opory. Nízke ťažisko znamená obrovskú stabilitu."}, {"q": "14. Ako môže skokan do výšky (napr. pri štýle Fosbury Flop) prejsť ponad latku, hoci jeho ťažisko v skutočnosti prejde POD latkou?", "options": ["Je to nemožné, ťažisko musí ísť vždy nad latku.", "Zohne telo do oblúka tak, že matematické ťažisko jeho tela sa ocitne vo vzduchu mimo jeho chrbta, teda pod úrovňou latky, zatiaľ čo jeho telo ponad ňu 'prekĺzne'.", "Lebo pri skoku jeho telo stratí hmotnosť.", "Lebo vzduch ho vytlačí nahor."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Ťažisko tela je pevný bod vnútri človeka.“ <b>Pravda:</b> Tvar tela mení polohu ťažiska. Výrazným prehnutím chrbta dostane skokan svoje ťažisko fyzicky 'pod' svoje telo. Môže tak prekonať latku vo výške 2,4 m, hoci jeho ťažisko stúpne napr. len do výšky 2,3 m."}, {"q": "15. Ak zdvihneš pravú ruku nad hlavu a ľavú necháš pri tele, čo sa stane s ťažiskom tvojho tela?", "options": ["Nič, ťažisko človeka je fixné v oblasti pupka.", "Posunie sa mierne nahor a doprava.", "Posunie sa nadol a doľava.", "Rozdelí sa na dve menšie ťažiská."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Ťažisko ľudského tela sa nemení.“ <b>Pravda:</b> Keďže rameno a ruka majú nejakú hmotnosť (a ty túto hmotnosť presunieš nahor a vpravo), celkový priemerný bod rozloženia hmotnosti (ťažisko) sa posunie tým istým smerom."}, {"q": "16. Lietadlo letí a postupne spaľuje palivo z nádrží ukrytých v krídlach. Mení sa tým poloha jeho ťažiska?", "options": ["Nie, lebo lietadlo má stále rovnaký tvar.", "Áno, úbytok hmotnosti paliva presúva ťažisko lietadla, čo musí pilot (alebo počítač) neustále vyrovnávať výškovkami, aby lietadlo nespadlo.", "Nie, lebo palivo bolo aj predtým vnútri.", "Áno, ale len vo výške nad 10 km."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Prázdna schránka má rovnaké ťažisko ako plná.“ <b>Pravda:</b> Kvapalina v nádržiach tvorí obrovskú časť hmotnosti lietadla. Ako palivo mizne (často nerovnomerne), ťažisko sa posúva. Udržať ťažisko v bezpečných hraniciach je kľúčové pre to, aby bolo lietadlo vôbec ovládateľné."}, {"q": "17. Postavíš na stôl dva prázdne rovnaké valce. Jeden je vysoký a úzky, druhý je nízky a široký. Ktorý má väčšiu stabilitu?", "options": ["Oba sú rovnako stabilné, ak vážia rovnako.", "Vysoký a úzky.", "Nízky a široký.", "Závisí od farby valca."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Stabilita závisí len od hmotnosti.“ <b>Pravda:</b> Stabilita závisí od veľkosti PLOCHY OPORY (čím širšia, tým lepšie) a VÝŠKY ŤAŽISKA (čím nižšie, tým lepšie). Nízky a široký valec spĺňa obe podmienky lepšie."}, {"q": "18. Kedy sa voľne stojaci predmet prevráti a spadne na zem?", "options": ["Keď sa nakloní o viac ako 45 stupňov.", "Keď naň zafúka vietor.", "Keď zvislá čiara (ťažnica) spustená z jeho ťažiska smerom nadol vyjde MIMO jeho plochu opory.", "Keď sa jeho ťažisko dotkne zeme."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Veci padajú, keď sú naklonené príliš veľa.“ <b>Pravda:</b> Nezáleží na uhle, ale na polohe ťažiska voči podstave. Ak zvislica z ťažiska dopadá do vnútra podstavy, predmet sa vráti späť. Akonáhle 'prekročí' okraj podstavy, gravitácia vytvorí moment sily, ktorý ho preklopí."}, {"q": "19. Prečo sa známa Šikmá veža v Pise doteraz neprevrátila, aj keď je veľmi naklonená?", "options": ["Pretože v Taliansku je slabšia gravitácia.", "Pretože je zviazaná lanami zo zadnej strany.", "Pretože zvislica spustená z jej ťažiska stále dopadá DOVNÚTRA jej širokých základov.", "Pretože vo vrchnej časti má nainštalovaný magnet."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Naklonená vec by mala logicky padnúť.“ <b>Pravda:</b> Kým je ťažisko 'nad' plochou opory, budova nespadne. Veža v Pise má našťastie veľmi širokú základňu a dole je masívnejšia ako hore."}, {"q": "20. Cestujúci v autobuse stoja a držia sa tyče. Keď autobus prudko zabrzdí, majú tendenciu spadnúť dopredu. Aký postoj by mali zaujať, aby to ustáli čo najľahšie?", "options": ["Stáť s nohami úplne pri sebe (postoj pozoru).", "Rozkročiť nohy v smere jazdy autobusu (jedna dopredu, druhá dozadu).", "Postaviť sa na špičky.", "Zdvinúť jednu nohu do vzduchu."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Pevný postoj je s nohami pri sebe.“ <b>Pravda:</b> Rozkročením v smere brzdenia si pasažier obrovsky zväčší plochu opory (vzídený priestor medzi nohami) v predo-zadnom smere. Ťažisko pri brzdení tak oveľa ťažšie opustí túto plochu."}, {"q": "21. Hračka 'Vstávajko' (kreslená figúrka, ktorá sa po zvalení vždy sama postaví) má vo vnútri tajomstvo. Aké?", "options": ["Má v spodnej časti ukrytú ťažkú záťaž (napr. olovo), takže jej ťažisko je extrémne nízko. Naklonením sa ťažisko zdvíha.", "Má vo vnútri batériu a motorček.", "Je naplnená héliom, ktoré ju ťahá hore.", "Závisí to len od jej guľatého tvaru."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Tvar zabezpečí, že sa vec sama postaví.“ <b>Pravda:</b> Tvar nestačí. Kľúčová je stabilná rovnovážna poloha – hračka má ťažisko tak nízko, že pri KAŽDOM naklonení sa toto ťažisko musí zdvihnúť. Systém sa však vždy snaží vrátiť do polohy s najnižším ťažiskom (vztyk)."}, {"q": "22. Aký typ rovnovážnej polohy predstavuje guľôčka, ktorá leží na dne guľatej misky?", "options": ["Vratnú (stabilnú) – po vychýlení sa vráti späť do najnižšieho bodu.", "Nevratnú (labilnú) – po vychýlení spadne.", "Voľnú (indiferentnú) – zostane stáť tam, kde ju posunieš.", "Dynamickú."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Všetka rovnováha je rovnaká.“ <b>Pravda:</b> Guľôčka v miske je klasický príklad stabilnej (vratnej) rovnováhy. Ak ju vychýliš do strany, jej ťažisko sa zvýši, a gravitácia ju stiahne späť do pôvodnej polohy na dno."}, {"q": "23. Guľôčka položená na úplne rovnom, vodorovnom stole bez jám. V akom type rovnováhy sa nachádza?", "options": ["Labilnej.", "Stabilnej.", "Voľnej (indiferentnej) – ak ju posunieš, jej ťažisko nezmení výšku a guľôčka zostane stáť na novom mieste.", "Nenachádza sa v rovnováhe."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ak ju drgnem a ide ďalej, bola labilná.“ <b>Pravda:</b> Pri voľnej rovnováhe sa výška ťažiska pri posúvaní po ploche nemení. Preto teleso nemá tendenciu sa ani vracať, ani zrýchľovať pád z pôvodného bodu. Kde ho necháš stáť, tam stojí."}, {"q": "24. Prečo je chôdza po úzkom múre oveľa ťažšia (labilnejšia) než chôdza po širokom chodníku?", "options": ["Lebo na múre pôsobí väčšia gravitácia.", "Lebo plocha opory (šírka múru) je veľmi malá a aj najmenší výkyv ťažiska spôsobí, že zvislica z ťažiska opustí túto plochu a my padáme.", "Lebo fúka vietor.", "Lebo na múre máme vyššie ťažisko než na chodníku."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Výška spôsobuje labilitu (strach).“ <b>Pravda:</b> Je jedno, či je múr vysoký 10 cm alebo 10 metrov (fyzikálne). Úzky pás znamená minimálnu plochu opory. Tvoje ťažisko je široké cca ako tvoje boky. Ak sa mierne nakloníš, ihneď presiahneš šírku múrika."}, {"q": "25. Máme dva valce s úplne rovnakou hmotnosťou a polomerom. Valec A je plný drevený (hmotnosť rovnomerne rozložená), valec B je dutá kovová rúra (všetka hmotnosť je na okraji plášťa). Majú rovnaký moment zotrvačnosti (neochotu roztočiť sa)?", "options": ["Áno, pretože majú rovnakú hmotnosť a polomer.", "Nie, dutý valec B má oveľa VÄČŠÍ moment zotrvačnosti.", "Nie, plný valec A má oveľa VÄČŠÍ moment zotrvačnosti.", "Závisí to od toho, kto ich točí."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Moment zotrvačnosti závisí iba od hmotnosti a veľkosti.“ <b>Pravda:</b> Závisí to od toho, AKO je hmota rozložená. Čím ďalej je hmota od osi otáčania (ako pri dutej rúre), tým väčší je moment zotrvačnosti (J = m * r²). Dutú rúru je oveľa ťažšie roztočiť."}, {"q": "26. Ak oba valce z predchádzajúcej otázky (A - plný, B - dutý) pustíme naraz voľne kotúľať z vrchu rovnakého kopca, ktorý z nich príde dole skôr?", "options": ["Obidva dorazia úplne naraz (ako pri voľnom páde).", "Dutý valec B príde skôr.", "Plný valec A príde skôr, pretože má menší moment zotrvačnosti (menej 'neochoty' točiť sa).", "Závisí to od trenia."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Galileo dokázal, že všetky telesá padajú rovnako rýchlo, takže aj kotúľanie je rovnaké.“ <b>Pravda:</b> Pri kotúľaní sa časť potenciálnej energie mení na posuvnú rýchlosť a časť na rotačnú. Dutý valec vyžaduje viac energie na samotné roztáčanie, takže mu zostane menej energie na pohyb dopredu."}, {"q": "27. Povrazolezec kráčajúci po lane nesie v rukách dlhú, vodorovnú, ťažkú tyč. Aký fyzikálny zmysel má táto tyč?", "options": ["Robí ho ťažším, aby na lano lepšie priliehal.", "Tyč slúži ako padák, ak by spadol.", "Tyč obrovsky ZVÄČŠUJE jeho moment zotrvačnosti okolo osi lana. Ak by začal padať do strany, bude sa preklápať oveľa pomalšie, čím získa čas na vyrovnanie.", "Nijaký, je to len tradičný cirkusový prvok."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Tyč sa používa len na držanie alebo pridáva váhu dole.“ <b>Pravda:</b> Dlhá tyč s hmotnosťou ďaleko od stredu tela dramaticky zvyšuje moment zotrvačnosti (neochotu rotovať/preklápať sa). Skús rýchlo otáčať dlhou tyčou v rukách – ide to veľmi ťažko."}, {"q": "28. Zotrvačník (ťažké roztočené koleso vnútri hračky alebo stroja) udržuje po roztočení objekt stabilný (napríklad vreteno, gyroskop, bicykel). Prečo je často hmota zotrvačníka sústredená čo najviac do masívneho okraja kolesa?", "options": ["Aby sa koleso nerozpadlo.", "Aby mal maximálny moment zotrvačnosti a dokázal v rotácii 'uskladniť' čo najviac energie.", "Aby bol čo najľahší.", "Aby sa nezastavil pre trenie so vzduchom."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Je jedno, ako koleso vyzerá, ide len o hmotnosť.“ <b>Pravda:</b> Hmotnosť natlačená na obvod (veľké r) maximalizuje vzorec J = mr². Koleso má tak obrovskú rotačnú zotrvačnosť, chráni ho to pred náhlymi zmenami a drží stabilitu osi."}, {"q": "29. Čo pre rotačný pohyb (otáčanie) predstavuje Moment zotrvačnosti (J)?", "options": ["Je to rýchlosť otáčania.", "Je to to isté, čo Hmotnosť (m) pre posuvný pohyb – vyjadruje mieru neochoty telesa zmeniť svoj rotačný stav.", "Je to odstredivá sila.", "Je to moment sily."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Rotujúce veci nemajú hmotnosť, len zotrvačnosť.“ <b>Pravda:</b> V kinematike a dynamike tuhého telesa je úplná analógia. Sila F → Moment sily M. Rýchlosť v → Uhlová rýchlosť ω. Hmotnosť m → Moment zotrvačnosti J."}, {"q": "30. Prečo je oveľa ťažšie udržať ceruzku balansovať na jej hrote ako balansovať dlhú metlu na jej rukoväti?", "options": ["Ceruzka má menší moment zotrvačnosti, takže sa preklopí (zrýchli svoj pád) oveľa rýchlejšie než dlhá metla.", "Metla je ťažšia, takže gravitácia ju lepšie ťahá nadol.", "Ceruzka má hladší povrch.", "Ceruzka je príliš ľahká."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Dlhé a ťažké predmety padajú rýchlejšie.“ <b>Pravda:</b> Preklápanie je rotácia okolo tvojej ruky. Dlhý predmet (metla) má z hľadiska ruky obrovský moment zotrvačnosti, takže jej pád do strany prebieha zreteľne pomalšie a tvoj mozog a ruka stihnú zareagovať a rovnováhu vyrovnať."}, {"q": "31. Keď zmeníš rozloženie svojej hmotnosti (napr. stiahneš ruky a nohy tesne k telu), tvoja HMOTNOSŤ sa nezmení. Čo sa však zmení?", "options": ["Zmení sa tvoj objem, takže na teba pôsobí iný tlak vzduchu.", "Zmení sa tvoj moment zotrvačnosti (výrazne sa zmenší).", "Tvoje ťažisko sa dostane mimo tela.", "Nezmení sa vôbec nič."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Zbalenie sa do klbka ovplyvňuje len aerodynamiku.“ <b>Pravda:</b> Aj keď máš stále napr. 70 kg, priblížením všetkých častí tela k osi rotácie drasticky znížiš svoj moment zotrvačnosti. Bude oveľa jednoduchšie ťa roztočiť (alebo zastaviť)."}, {"q": "32. Máš dve dvere s rovnakou hmotnosťou a rozmermi. Na jedných sú ťažké olovené pláty blízko pántov, na druhých sú olovené pláty blízko kľučky. Ktoré dvere sa budú otvárať ŤAŽŠIE (budú klásť väčší odpor pri zrýchľovaní)?", "options": ["Dvere s plátmi pri kľučke (hmota ďaleko od osi).", "Dvere s plátmi pri pántoch (hmota blízko osi).", "Obidvoje dvere rovnako, lebo majú rovnakú celkovú hmotnosť.", "Nedá sa určiť."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Hmotnosť dverí je jediný dôležitý faktor pre ťažké otváranie.“ <b>Pravda:</b> Hmota ďaleko od pántov (r je obrovské) vytvára obrovský moment zotrvačnosti. Tieto dvere bude oveľa náročnejšie rozhýbať (a následne aj zabrzdiť) ako tie, ktoré majú váhu tesne pri pántoch."}, {"q": "33. Krasokorčuliarka sa pomaly otáča na ľade s upaženými rukami. Následne ruky stiahne prudko k telu a zrazu sa začne otáčať obrovskou rýchlosťou. Prečo sa zrýchlila?", "options": ["Využila silu svalov na to, aby sa 'potlačila' rýchlejšie.", "Platí zákon zachovania momentu hybnosti. Tým, že stiahla ruky, zmenšila svoj moment zotrvačnosti, takže jej uhlová rýchlosť musela narásť, aby ich súčin ostal konštantný.", "Odpor vzduchu ju stlačil.", "Gravitácia ju donútila krútiť sa rýchlejšie."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Zrýchlenie rotácie vyžaduje dodať novú energiu odrazom.“ <b>Pravda:</b> Moment hybnosti L = J * ω. Keď sa netrie o ľad, L je konštantné. Ak stiahne ruky k sebe (zmenší r), zmenší sa J. Aby sa rovnica vyrovnala, uhlová rýchlosť (ω) musí vystreliť nahor."}, {"q": "34. Malé autíčko (1000 kg) a obrovský kamión (40 000 kg) idú po ceste rovnakou rýchlosťou 50 km/h. Do čoho naraziť by bolo ničivejšie a prečo?", "options": ["Do oboch rovnako, lebo majú rovnakú rýchlosť.", "Do autíčka, lebo je koncentrovanejšie.", "Do kamióna, lebo má oveľa väčšiu HYBNOSŤ (p = m*v) vďaka obrovskej hmotnosti, a je veľmi ťažké ho zastaviť.", "Závisí to od tvaru nárazníka."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rýchlosť určuje deštrukčnú silu.“ <b>Pravda:</b> Hybnosť objektu (v bežnej reči 'momentum' alebo 'ráz') je m * v. Kamión s rovnakou rýchlosťou má 40-násobne väčšiu hybnosť. Zastaviť ho znamená prebrať na seba tento gigantický ráz."}, {"q": "35. Sedíš na otočnej kancelárskej stoličke s nohami vo vzduchu. V rukách držíš točiace sa koleso z bicykla. Keď koleso v rukách prevrátiš hore nohami, ty a stolička sa začnete točiť opačným smerom. O aký fyzikálny princíp ide?", "options": ["Zákon zachovania momentu hybnosti.", "Zákon zachovania energie.", "1. Newtonov zákon.", "Trenie ložísk."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Koleso sa preklopí a ja len stratím rovnováhu.“ <b>Pravda:</b> Izolovaný systém (ty + koleso) má celkový moment hybnosti. Keď zmeníš smer otáčania kolesa (preklopíš ho), tvoje telo sa MUSÍ začať točiť naopak, aby sa po sčítaní vektorov moment hybnosti systému nezmenil a zachoval."}, {"q": "36. Úplne nepružná zrážka: Dve rovnako ťažké autá z plastelíny do seba čelne narazia rovnakou rýchlosťou. Zlepia sa a zastanú na mieste (v = 0). Stratila sa pri tejto zrážke nejaká hybnosť?", "options": ["Áno, všetka hybnosť zmizla (porušil sa zákon zachovania hybnosti).", "Nie! Hybnosť je vektor. Jedno auto malo hybnosť p, druhé -p. Súčet hybností PRED zrážkou bol nula, a PO zrážke je tiež nula. Zákon je dodržaný.", "Áno, ale len polovica hybnosti sa stratila.", "Nie, hybnosť sa premenila na teplo."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Keď veci zastanú, hybnosť zmizne.“ <b>Pravda:</b> Energia je číslo (skalár) a premení sa na teplo a deformáciu plastelíny. Hybnosť je však šípka (vektor). Dve rovnako dlhé protichodné šípky sa sčítajú na nulu už pred zrážkou! Takže celková hybnosť systému pred aj po zrážke bola vždy nulová."}, {"q": "37. Kapsula vo vesmíre (vo vákuu bez gravitácie) sa potrebuje pohnúť dopredu. Ako to dosiahne bez odrážania sa od iných predmetov?", "options": ["Je to nemožné, potrebuje vzduch, o ktorý by sa motor oprel.", "Vyhodí zo svojej zadnej časti obrovskou rýchlosťou prúd plynov. Kapsula tak získa hybnosť vpred na základe zákona zachovania hybnosti (reaktívny pohon).", "Otáčaním vnútorného kolesa.", "Mávaním solárnymi panelmi."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Raketa sa musí vo vesmíre od niečoho odstrčiť (od atmosféry).“ <b>Pravda:</b> Raketa sa 'odstrkuje' od vlastného paliva! Keď vyhodí masu plynu dozadu s hybnosťou (m*v), samotná raketa musí nabrať presne tú istú hybnosť smerom dopredu, aby celkový súčet zostal nula. Vákuum nie je problém."}, {"q": "38. Strelíš z pušky. Guľka letí obrovskou rýchlosťou vpred a teba puška silno kopne do pleca dozadu. Čo majú guľka a puška (tesne po výstrele) ROVNAKÉ?", "options": ["Rýchlosť pohybu (v m/s).", "Kinetickú energiu.", "Veľkosť hybnosti (p = m*v), aj keď guľka je rýchla/ľahká a puška ťažká/pomalá.", "Zrýchlenie."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Malá guľka má oveľa väčšiu hybnosť ako ja, a preto letí prierazne.“ <b>Pravda:</b> Podľa zákona zachovania hybnosti m1*v1 = m2*v2. Guľka získa hybnosť vpred, puška presne tú istú hybnosť vzad. Pretože máš ty s puškou veľkú hmotnosť, tvoja spätná rýchlosť v2 je malá a prežiješ to."}, {"q": "39. Mačka padá chrbtom k zemi. Vo vzduchu však dokáže pokrútiť telom, chvostom a labami tak, že bez akéhokoľvek oporného bodu (vo vzduchu) dopadne na štyri. Porušuje tým zákon zachovania momentu hybnosti?", "options": ["Áno, je to biologická anomália.", "Áno, ale trenie vzduchu jej to umožňuje.", "Nie. Rôznym vzďaľovaním/približovaním predných a zadných labiek (zmenou lokálneho momentu zotrvačnosti) dokáže otočiť prednú časť tela inak ako zadnú tak, že celkový moment hybnosti jej rotácie zostáva stále nulový.", "Nie, ona mágiu nerieši, riadi sa inštinktom."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Nemôžem zmeniť orientáciu tela vo vzduchu bez vonkajšej sily.“ <b>Pravda:</b> Ak stiahneš predné labky (malý moment zotrvačnosti) a roztiahneš zadné, prednú polovicu otočíš ľahko. Potom to vymeníš. Celkový uhlový moment L je stále nula, no mačka zmení orientáciu tela a zachráni si život."}, {"q": "40. V akej situácii sa zachováva celková hybnosť sústavy dvoch telies?", "options": ["Len vtedy, keď je zrážka dokonale pružná (napr. biliardové gule).", "Len vtedy, keď sa objekty pohybujú v rovnakom smere.", "Vždy, za predpokladu, že na systém nepôsobia VÝZNAMNÉ VONKAJŠIE SILY (ide o tzv. izolovanú sústavu), bez ohľadu na to, či sa zrazia pružne, alebo sa do seba zlepia.", "Len vo vákuu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Keď sa zrazia autá a pokrčia plechy (stratí sa kinetická energia), stratí sa aj hybnosť.“ <b>Pravda:</b> Zákon zachovania hybnosti je jeden z najsilnejších zákonov vesmíru. Ak vynecháme brzdenie o cestu (vonkajšia trecia sila), hybnosť sa plne zachováva aj vtedy, keď sa objekty deštruktívne zrazia (zatiaľ čo energia sa mení na teplo a plechy)."}];
        let currentQuestion = 0; let score = 0;
        const questionHeader = document.getElementById('questionHeader');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackBox = document.getElementById('feedbackBox');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');

        function loadQuestion() {
            feedbackBox.className = 'feedback-box'; feedbackBox.innerHTML = '';
            nextBtn.classList.remove('show'); optionsContainer.innerHTML = '';
            const q = quizData[currentQuestion];
            questionHeader.textContent = `Otázka ${currentQuestion + 1} z ${quizData.length}`;
            questionText.innerHTML = q.q;
            progressBar.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerHTML = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = quizData[currentQuestion]; const allBtns = optionsContainer.children;
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.answer) allBtns[i].classList.add('correct');
            }
            if (selectedIndex === q.answer) {
                score++;
                feedbackBox.className = 'feedback-box show correct-feedback';
                feedbackBox.innerHTML = `<b>Správne! 🎉</b> ${q.explanation}`;
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackBox.className = 'feedback-box show incorrect-feedback';
                feedbackBox.innerHTML = `<b>Nesprávne.</b> ${q.explanation}`;
            }
            if (currentQuestion === quizData.length - 1) nextBtn.textContent = 'Zobraziť výsledky ➔';
            nextBtn.classList.add('show');
            setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) loadQuestion(); else showResults();
        }

        function showResults() {
            progressBar.style.width = '100%'; quizScreen.style.display = 'none'; resultScreen.style.display = 'block';
            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreDisplay').innerHTML = `<span>${score}</span><span style="font-size: 1.2rem; opacity: 0.8">/${quizData.length}</span>`;
            document.getElementById('resultTitle').textContent = percentage >= 90 ? "Majster rotácie! ⚙️" : percentage >= 70 ? "Skvelá stabilita! 👍" : percentage >= 50 ? "Máš dobrý základ. 📚" : "Strácaš rovnováhu. 💡";
            document.getElementById('resultMsg').textContent = percentage >= 90 ? "Mechanika tuhého telesa a zákony rotácie ti nerobia najmenší problém. Chápeš nielen silu, ale aj jej ramená a zotrvačnosť!" : percentage >= 70 ? "Výborne. Väčšinu pravidiel o ťažisku a hybnosti zvládaš bez problémov. Pozor len na chytáky so zachovaním hybnosti pri zrážkach." : percentage >= 50 ? "Základy chápeš, no treba si viac prepojiť zotrvačnosť rozloženia hmoty (krasokorčuliarka, tyč povrazolezca) s momentom hybnosti." : "Odporúčam zopakovať si rozdiel medzi silou a momentom sily. Pamätaj: v rotácii záleží na tom, KDE a AKO ďaleko od osi pôsobíš, nielen akou silou!";
        }
        loadQuestion();
    </script>
