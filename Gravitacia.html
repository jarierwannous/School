<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kvíz: Fyzikálne miskoncepcie - Gravitácia a pohyby v poli</title>
    <style>
        :root {
            --primary: #2563eb; /* Blue/Indigo color for Gravity & Space */
            --primary-hover: #1d4ed8;
            --bg-color: #eff6ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body, html { height: 100%; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
        .progress-container { width: 100%; height: 6px; background-color: #bfdbfe; position: fixed; top: 0; left: 0; z-index: 10; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.4s ease; }
        .app-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        .quiz-card { background: var(--card-bg); width: 100%; border-radius: 16px; padding: 30px 25px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; }
        .question-header { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; font-size: 1.05rem; text-align: left; cursor: pointer; transition: all 0.2s ease; color: var(--text-main); font-weight: 500; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #dbeafe; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
        .option-btn.incorrect { background-color: var(--incorrect-bg); border-color: var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1rem; line-height: 1.5; display: none; animation: fadeIn 0.4s ease; }
        .feedback-box.show { display: block; }
        .feedback-box.correct-feedback { background-color: var(--correct-bg); border-left: 5px solid var(--correct-border); color: var(--correct-text); }
        .feedback-box.incorrect-feedback { background-color: var(--incorrect-bg); border-left: 5px solid var(--incorrect-border); color: var(--incorrect-text); }
        .feedback-box b { display: block; margin-bottom: 6px; font-size: 1.1rem; }
        .action-btn { margin-top: 20px; background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; width: 100%; display: none; }
        .action-btn:hover { background-color: var(--primary-hover); }
        .action-btn.show { display: block; animation: fadeIn 0.4s ease; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; margin: 0 auto 30px auto; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); }
        .result-title { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
        .result-msg { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .app-container { padding: 10px; } .quiz-card { padding: 20px 15px; } .question-text { font-size: 1.2rem; } .option-btn { font-size: 0.95rem; padding: 12px 14px; } }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="app-container">
        <div class="quiz-card" id="quizScreen">
            <div class="question-header" id="questionHeader">Otázka 1 / 40</div>
            <div class="question-text" id="questionText">Otázka sa načítava...</div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Ďalšia otázka ➔</button>
        </div>
        <div class="quiz-card result-screen" id="resultScreen">
            <div class="score-circle" id="scoreDisplay">0%</div>
            <div class="result-title" id="resultTitle">Vyhodnotenie</div>
            <div class="result-msg" id="resultMsg">Správa</div>
            <button class="action-btn show" onclick="location.reload()">Spustiť kvíz znova</button>
        </div>
    </div>
    <script>
        const quizData = [{"q": "1. Vylezieš na vrchol Gerlachovského štítu. Ako sa zmení gravitačná sila, ktorá na teba pôsobí, v porovnaní s tým, keď stojíš pri mori?", "options": ["Bude polovičná, pretože som bližšie k vesmíru.", "Úplne zmizne, ak vyjdem dostatočne vysoko do mrakov.", "Zmenší sa len o zanedbateľný zlomok percenta (takmer ju necítiť).", "Zväčší sa, pretože som ďalej od stredu Zeme."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Gravitácia rapídne klesá, ak vyjdem na vysoký kopec.“ <b>Pravda:</b> Polomer Zeme je vyše 6370 km. Zmena výšky o pár kilometrov znamená zväčšenie vzdialenosti od stredu len o zlomok percenta. Gravitačné zrýchlenie klesne z cca 9,81 m/s² len na cca 9,80 m/s²."}, {"q": "2. Prečo pri bežných úlohách (napr. hod loptou na ihrisku) považujeme gravitačné pole Zeme za homogénne a nie centrálne (radiálne)?", "options": ["Pretože Zem je dokonale plochá.", "Pretože vo vákuu sa centrálne pole mení na homogénne.", "Lebo na malých úsekoch blízko povrchu sú siločiary prakticky rovnobežné a veľkosť sily g sa nemení.", "Lebo Zem nemá vo svojom strede žiadnu hmotu."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Gravitácia vždy a všade pôsobí do jedného bodu, takže pole je zložité.“ <b>Pravda:</b> Aj keď je pole Zeme centrálne, v mierke ľudských rozmerov a bežných pohybov (ihrisko, budova) sa vzdialenosti a uhly síl do stredu Zeme menia tak nepatrne, že ich považujeme za úplne rovnobežné a konštantné."}, {"q": "3. Poľovník drží pušku vodorovne. Jednu guľku z nej vystrelí (obrovskou rýchlosťou vpred) a v tom istom zlomku sekundy druhú guľku z rovnakej výšky voľne pustí na zem. Ktorá dopadne skôr (vo vákuu)?", "options": ["Pustená guľka dopadne oveľa skôr.", "Vystrelená guľka dopadne skôr, lebo má veľkú energiu.", "Obe dopadnú presne v rovnakom čase.", "Vystrelená guľka nikdy nespadne."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Rýchlosť vodorovného letu bráni objektu padať nadol.“ <b>Pravda:</b> Horizontálny pohyb (rovnomerný) a vertikálny pád (rovnomerne zrýchlený) sú vo vodorovnom vrhu ÚPLNE NEZÁVISLÉ. Gravitácia ťahá obe guľky k zemi rovnako, preto dopadnú naraz."}, {"q": "4. Záchranárske lietadlo letí vodorovne stálou rýchlosťou. Zrazu z neho vypustia balík s pomocou. Akú dráhu opíše balík pri pohľade zo zeme (bez odporu vzduchu) a kde dopadne?", "options": ["Padá kolmo nadol a dopadne ďaleko za lietadlom.", "Padá po parabole dozadu za lietadlo.", "Padá po parabole dopredu a počas celého pádu zostáva presne pod lietadlom.", "Na chvíľu sa zastaví a potom spadne zvislo."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Keď pustím predmet z letiaceho stroja, okamžite zaostane a padá dole.“ <b>Pravda:</b> Podľa zákona zotrvačnosti má balík počiatočnú vodorovnú rýchlosť presne rovnakú ako lietadlo. Kým zvislo zrýchľuje nadol, vodorovne letí rovnomerne spolu s lietadlom."}, {"q": "5. Ako vyzerá pád toho istého balíka z predchádzajúcej otázky, ak sa naň pozerá priamo pilot lietadla (ktoré letí rovnomerne ďalej)?", "options": ["Vidí, ako mu balík uniká dozadu a dole.", "Vidí ho padať kolmo dolu, priamo pod seba.", "Vidí ho letieť dopredu pred lietadlo.", "Nevidí ho padať, balík vznáša."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Každý pozorovateľ vidí pád po rovnakej parabole.“ <b>Pravda:</b> Pre pilota nemá balík relatívnu vodorovnú rýchlosť (hýbu sa rovnako). Z jeho pohľadu (vzťažnej sústavy) koná balík iba čistý voľný pád kolmo nadol."}, {"q": "6. Kopneš loptu z okraja vysokého útesu vodorovne nad more. Ako sa na začiatku poletu správa jej dráha?", "options": ["Letí chvíľu rovno vodorovne a potom začne padať.", "Začína okamžite klesať a tvorí plynulú parabolu.", "Letí šikmo pod uhlom 45 stupňov hneď od začiatku.", "Letí rovno, kým nestratí zotrvačnosť."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Teleso letí vodorovne, kým mu 'nedôjde sila', a až potom padne.“ <b>Pravda:</b> Vodorovný vrh začína padať smerom nadol presne v momente opustenia útesu, pretože tiažové zrýchlenie začne pôsobiť okamžite. Dráha je od prvej stotiny sekundy zakrivená (parabola)."}, {"q": "7. Podľa Newtonovho gravitačného zákona sa telesá priťahujú. Zem priťahuje jablko. Priťahuje aj jablko Zem?", "options": ["Nie, iba väčšie teleso priťahuje menšie.", "Áno, ale len veľmi malou silou, oveľa menšou, než pôsobí Zem.", "Áno, jablko priťahuje Zem presne rovnako veľkou silou, akou Zem priťahuje jablko.", "Áno, jablko priťahuje Zem väčšou silou."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Silnejšie (hmotnejšie) teleso vyvíja väčšiu gravitačnú silu než to ľahšie.“ <b>Pravda:</b> Gravitácia je vzájomná interakcia podľa 3. Newtonovho zákona (akcia = reakcia). Sila je pre obe telesá úplne ROVNAKÁ, líšia sa len účinky (jablko prudko zrýchli, Zem sa ani nepohne, lebo má gigantickú hmotnosť)."}, {"q": "8. Ak by sme Zem a Mesiac oddialili na DVOJNÁSOBNÚ vzdialenosť, aká by bola gravitačná príťažlivá sila medzi nimi?", "options": ["Polovičná.", "Zostala by rovnaká.", "Dvojnásobná.", "Štvornásobne menšia."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Dvojnásobná vzdialenosť znamená polovičnú silu.“ <b>Pravda:</b> Gravitačná sila klesá s DRUHOU MOCNINOU vzdialenosti (zákon prevrátených štvorcov, r²). Ak vzdialenosť r zväčšíš 2-krát, sila klesne 2² = 4-krát."}, {"q": "9. Zhodíš z balkóna loptičku A (voľný pád). Loptičku B vyhodíš presne vodorovne rýchlosťou 5 m/s z tej istej výšky. Čo platí o ich zvislej zložke rýchlosti (rýchlosti padania) počas letu?", "options": ["Loptička A padá zvislo rýchlejšie.", "Loptička B padá zvislo rýchlejšie, lebo má počiatočnú energiu.", "Obe loptičky majú v každom okamihu úplne rovnakú zvislú rýchlosť.", "Nedá sa to porovnať."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Vodorovná rýchlosť nejako ovplyvňuje, ako rýchlo objekt padá k zemi.“ <b>Pravda:</b> Vodorovná rýchlosť nemá absolútne žiadny vplyv na zvislý pád. Obe naberajú zvislú rýchlosť v(y) = g * t, preto naraz letia k zemi úplne rovnako."}, {"q": "10. Vyhodíš kameň šikmo nahor (napríklad pod uhlom 45°). Čo platí pre jeho rýchlosť v ÚPLNE NAJVYŠŠOM bode jeho dráhy?", "options": ["Je presne nulová (kameň stojí).", "Zvislá rýchlosť je nula, ale kameň sa naďalej pohybuje konštantnou vodorovnou rýchlosťou dopredu.", "Kameň má len zvislú rýchlosť.", "Smeruje opačne ako na začiatku."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „V najvyššom bode šikmého vrhu teleso úplne zastaví.“ <b>Pravda:</b> Úplne zastaví iba pri zvislom vrhu. Pri šikmom vrhu kameň v najvyššom bode prestane stúpať (zvislá zložka je 0), ale horizontálne neustále letí dopredu."}, {"q": "11. Pod akým uhlom od zeme musíš vystreliť z dela projektil (vo vákuu, bez odporu vzduchu), aby doletel horizontálne ČO NAJĎALEJ?", "options": ["Pod uhlom 30°.", "Pod uhlom 45°.", "Pod uhlom 60°.", "Čím strmšie nahor (bližšie k 90°), tým lepšie."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Najďalej doletí, keď strelím zarovno so zemou alebo vysoko do vzduchu.“ <b>Pravda:</b> Uhol 45° je matematický kompromis: projektil je vo vzduchu dostatočne dlho (výška) a zároveň má veľkú rýchlosť vpred."}, {"q": "12. Aké je zrýchlenie futbalovej lopty v najvyššom bode jej letu, potom čo bola vykopnutá brankárom vysoko do vzduchu (šikmý vrh)?", "options": ["Nula, lebo rýchlosť sa tam zastavila alebo ustálila.", "Má hodnotu tiažového zrýchlenia (g) a smeruje nadol.", "Smeruje vodorovne v smere letu.", "Mení sa podľa hmotnosti lopty."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Na vrchole dráhy gravitácia na chvíľu vypne alebo prestane zrýchľovať loptu.“ <b>Pravda:</b> Gravitácia neustále, v každom jedinom okamihu ťahá loptu nadol so zrýchlením g = 9,81 m/s², či už lopta stúpa, klesá alebo je na vrchole."}, {"q": "13. Guľa vystrelená z dela letí vzduchom obrovskou rýchlosťou (odpor zanedbáme). Aké sily na ňu reálne pôsobia počas letu?", "options": ["Hnacia sila z výbuchu smerom dopredu a gravitácia nadol.", "Len gravitačná sila smerom nadol.", "Odstredivá sila a gravitácia.", "Sila zotrvačnosti vpred a tiaž nadol."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Vymrštené teleso nesie v sebe hnaciu silu (impetus).“ <b>Pravda:</b> Akonáhle guľa opustí hlaveň, žiadna sila ju už vpred netlačí. Letí dopredu čisto len vďaka ZOTRVAČNOSTI (čo nie je sila). Jediná skutočná sila, ktorá na ňu celou cestou pôsobí, je gravitácia Zeme smerom nadol."}, {"q": "14. Podľa Keplerovho prvého zákona, aký je skutočný tvar obežnej dráhy Zeme okolo Slnka?", "options": ["Dokonalá kružnica so Slnkom v strede.", "Elipsa s veľmi veľkým sploštením (ako ovál).", "Elipsa s veľmi malou excentricitou, ktorá vyzerá voľným okom takmer ako kružnica (Slnko je v jednom z ohnísk).", "Zložitá špirála."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Zem obieha po veľmi sploštenom ovále, čo spôsobuje zimy a letá.“ <b>Pravda:</b> Obežná dráha Zeme je matematicky elipsa, ale je taká málo sploštená, že keby si ju videl nakreslenú na papieri, považoval by si ju za dokonalý kruh."}, {"q": "15. Spôsobuje striedanie ročných období to, že Zem je na svojej eliptickej dráhe v lete bližšie k Slnku a v zime ďalej?", "options": ["Áno, to je hlavný dôvod leta a zimy.", "Nie, ročné obdobia spôsobuje náklon zemskej osi, nie vzdialenosť od Slnka.", "Áno, ale vplyv má aj otepľovanie Zeme.", "Nie, Zem je predsa od Slnka vždy rovnako ďaleko."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Blízkosť k Slnku = Leto.“ <b>Pravda:</b> Zaujímavé je, že Zem je k Slnku NAJBLIŽŠIE začiatkom januára (keď máme zimu)! Ročné obdobia sú spôsobené výlučne tým, že os rotácie Zeme je naklonená (23,5°), čím dopadajú lúče Slnka pod iným uhlom."}, {"q": "16. Keplerov druhý zákon hovorí o plošnej rýchlosti. Čo to znamená pre rýchlosť pohybu planéty na jej eliptickej dráhe?", "options": ["Planéta sa pohybuje neustále konštantnou rýchlosťou.", "Planéta spomalí, keď sa dostane do tieňa inej planéty.", "Planéta sa pohybuje NAJRÝCHLEJŠIE, keď je k hviezde NAJBLIŽŠIE (v perihéliu).", "Planéta zrýchľuje, čím ďalej od hviezdy uniká."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Planéty plynule krúžia rovnakým tempom.“ <b>Pravda:</b> Zákon zachovania momentu hybnosti spôsobuje, že planéta v blízkosti Slnka (perihélium) letí po dráhe veľmi rýchlo a keď je ďaleko (afélium), výrazne spomalí."}, {"q": "17. Keplerov tretí zákon porovnáva vzdialenosti a doby obehov. Ktorá planéta v našej slnečnej sústave potrebuje najviac času na jeden obeh okolo Slnka (najdlhší 'rok')?", "options": ["Najťažšia planéta (Jupiter).", "Najľahšia planéta (Merkúr).", "Planéta, ktorá je od Slnka NAJĎALEJ (Neptún).", "Obežný čas nezávisí od ničoho, je to náhoda."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Hmotnejším (väčším) planétam trvá obeh dlhšie, lebo sú ťažké.“ <b>Pravda:</b> Obežná doba závisí LEN od priemernej vzdialenosti od Slnka (a). Čím si ďalej, tým dlhšie ti trvá obeh, bez ohľadu na tvoju hmotnosť (Zem 1 rok, Neptún 165 rokov)."}, {"q": "18. Pustíš kameň z voľného pádu do priepasti. Prvú sekundu preletí približne 5 metrov. Koľko metrov padne LEN počas ďalšej (druhej) sekundy?", "options": ["Tiež 5 metrov.", "Zhruba 10 metrov.", "Zhruba 15 metrov.", "Zhruba 25 metrov."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „V každej sekunde padne teleso o 9,8 metra hlbšie.“ <b>Pravda:</b> Zrýchlenie je 9,8 (zaokrúhlene 10). Dráha však rastie kvadraticky. Za 1 sekundu padne kameň 5 m. Za 2 sekundy padne CELKOVO 20 m. Rozdiel (dráha LEN za druhú sekundu) je 20 - 5 = 15 metrov!"}, {"q": "19. Astronauti na Medzinárodnej vesmírnej stanici (ISS) sa vznášajú (sú v stave beztiaže). Prečo?", "options": ["Pretože vo výške 400 km už takmer nie je zemská gravitácia.", "Pretože vesmírna stanica neustále padá voľným pádom, a oni padajú s ňou.", "Pretože tam nepôsobí žiaden tlak vzduchu.", "Pretože astronauti sú pripútaní neviditeľnými magnetmi."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Vesmír rovná sa nulová gravitácia.“ <b>Pravda:</b> Gravitácia na ISS je stále cca 90 % z tej na Zemi! Vznášajú sa preto, lebo sa rútia dopredu rýchlosťou 28 000 km/h. Zem sa pod nimi zakrivuje presne tak rýchlo, ako oni vplyvom gravitácie klesajú – padajú, ale nikdy nedopadnú na povrch."}, {"q": "20. Zhodíš z balkóna loptičku A vodorovne rýchlosťou 2 m/s. Z toho istého balkóna zhodíš loptičku B vodorovne obrovskou rýchlosťou 20 m/s. Ktorá bude vo vzduchu dlhšie?", "options": ["Loptička A bude padať dlhšie.", "Loptička B (rýchlejšia) zostane vo vzduchu dlhšie, lebo doplachtí ďalej.", "Budú vo vzduchu presne rovnako dlho.", "Loptička B klesne k zemi okamžite."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Čím rýchlejšie vodorovne niečo hodím, tým dlhšie sa to udrží vo vzduchu.“ <b>Pravda:</b> Čas pádu závisí výlučne od zvislej vzdialenosti (výšky balkóna) a gravitácie (g). Keďže obe majú zvislú rýchlosť na začiatku NULA a rovnakú výšku, padnú na zem v rovnakej stotine. Loptička B len pristane oveľa ďalej."}, {"q": "21. Stojíš na korbe auta, ktoré ide stabilnou rýchlosťou 50 km/h po priamej ceste bez jám. Vyhodíš jablko priamo kolmo nahor a čakáš s nastavenou rukou. Kde jablko dopadne (ak ignorujeme vietor)?", "options": ["Spadne ti presne naspäť do ruky.", "Spadne za teba, lebo auto ti utečie dopredu.", "Spadne pred teba.", "Spadne do strany."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Keď jablko opustí ruku, stratí rýchlosť auta a zostane pozadu.“ <b>Pravda:</b> Vo chvíli vyhodenia má jablko horizontálnu zotrvačnú rýchlosť 50 km/h. Túto rýchlosť si drží aj počas letu (Galileova relativita pohybu), a preto cestuje vpred presne s tebou."}, {"q": "22. Pri ideálnom šikmom vrhu (vo vákuu) je najlepší uhol pre maximálny dolet 45°. Ako to je v realite pri vrhu bejzbalovej loptičky, keď pôsobí aj ODPOR VZDUCHU?", "options": ["Uhol pre najdlhší dolet je stále presne 45°.", "Najdlhší dolet dosiahneš uhlom MENEJ ako 45° (napr. 40°).", "Najdlhší dolet dosiahneš uhlom VIAC ako 45° (napr. 50°).", "Vo vzduchu sa musí loptička hádzať len vodorovne."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Matematické ideálne uhly fungujú rovnako aj v realite s atmosférou.“ <b>Pravda:</b> Odpor vzduchu prudko spomaľuje rýchlu loptičku. Ak ju vyhodíš príliš vysoko (45°), loptička stihne stratiť rýchlosť a 'spadne dole' priskoro. Výhodnejšie je hádzať ju 'plochejšie' (okolo 35°-40°), aby sa zachovala silná zložka rýchlosti vpred."}, {"q": "23. Tvrdenie: 'Ak vytvoríme úplné vákuum (odsajeme všetok vzduch), vznikne tým automaticky stav beztiaže.'", "options": ["Áno, vzduch je to, čo prenáša gravitáciu.", "Nie. Vákuum je len absencia hmoty (vzduchu), gravitácia vo vákuu pôsobí úplne bez problémov.", "Áno, ale gravitácia zmizne len pre ľahké predmety.", "Nie, gravitácia sa vo vákuu naopak zväčší desaťnásobne."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Vákuum a nulová gravitácia je to isté.“ <b>Pravda:</b> Tieto dve veci nemajú nič spoločné. Na Mesiaci je obrovské vákuum, a napriek tomu ťa Mesiac priťahuje svojou gravitáciou na svoj povrch."}, {"q": "24. Prečo padajú 100-kilogramová olovená guľa a 1-gramové pierko vo vákuu vedľa seba úplne naraz a rovnakým zrýchlením (g)?", "options": ["Pretože vo vákuu zmizne ich hmotnosť.", "Lebo gravitácia nevie rozoznať materiály a ignoruje olovo.", "Na ťažkú guľu pôsobí väčšia gravitačná sila, ale táto guľa má zároveň obrovskú neochotu meniť pohyb (zotrvačnosť). Tieto dva efekty sa vyrovnajú.", "Lebo vákuum pridáva pierku dodatočnú tiaž."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Ťažšie teleso by aj vo vákuu malo padať rýchlejšie.“ <b>Pravda:</b> Gravitačná sila (Fg) je úmerná hmotnosti. Ale podľa a = Fg / m si všimneme, že hmotnosť m v menovateli (zotrvačnosť) rastie rovnako ako Fg v čitateli. Podiel je konštantný a volá sa g."}, {"q": "25. Vyhodíš loptičku priamo NAHOR z mosta počiatočnou rýchlosťou 10 m/s. Druhú loptičku hodíš priamo NADOL (smerom k vode) rýchlosťou 10 m/s. Aké je ich zrýchlenie prvé 2 sekundy letu?", "options": ["Loptička smerujúca nahor má záporné zrýchlenie, tá dole má kladné.", "Obe majú presne rovnaké zrýchlenie (g smerom nadol).", "Loptička hodená nadol má oveľa väčšie zrýchlenie.", "Loptička nahor nemá zrýchlenie, len stráca rýchlosť."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Smer zrýchlenia g sa mení podľa toho, kam hádžem vec.“ <b>Pravda:</b> Gravitácia nevie a nezaujíma sa, kam letíš. Od momentu, keď teleso opustí ruku, pôsobí naň konštantné zrýchlenie 9,81 m/s² smerom do stredu Zeme."}, {"q": "26. Kedy na teba pôsobí najväčšia gravitačná sila Zeme?", "options": ["Keď sedíš pokojne na stoličke.", "Keď vyskočíš do výšky (si vo vzduchu).", "Keď padáš zo schodov.", "Gravitačná sila Zeme je v tvojom meste prakticky rovnaká, nech robíš čokoľvek z vyššie uvedeného."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Pohyb mení gravitačnú silu, ktorou som priťahovaný.“ <b>Pravda:</b> Sila F = G*m1*m2/r². Tvoja hmotnosť ani hmotnosť Zeme sa skokom nezmenili a vzdialenosť (r) od stredu Zeme je prakticky rovnaká. Mení sa len normálová sila (podlaha), čo v nás vyvoláva pocit zmeny 'tiaže'."}, {"q": "27. Keby si vyvŕtal super-hlboký tunel skrz celú planétu Zem a padal by si doň, kde by bolo tvoje gravitačné zrýchlenie vôbec NAJVÄČŠIE?", "options": ["V samotnom strede Zeme (v jadre).", "Na povrchu Zeme.", "V hĺbke asi 10 kilometrov.", "Zrýchlenie by sa celú cestu dole vôbec nemenilo."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „V strede planéty je najväčšia gravitácia.“ <b>Pravda:</b> Ako klesáš do vnútra, čoraz viac hmoty Zeme zostáva NAD tebou a ťahá ťa naspäť hore, čo vyrušuje priťahovanie spodných vrstiev. V presnom strede Zeme sa sily zo všetkých strán vyrušia a zrýchlenie je NULA (stav beztiaže)! Najväčšie g je teda na povrchu."}, {"q": "28. Mesiac obieha Zem bez prestania už miliardy rokov. Prečo sa neodpojí a neodletí preč do vesmíru?", "options": ["Lebo v zemskej atmosfére sa správa ako vír.", "Lebo ho Zem neustále priťahuje gravitačnou silou (tá plní funkciu dostredivej sily, ktorá ho 'odkláňa' z priamej cesty).", "Lebo ho slnečný vietor tlačí dovnútra.", "Lebo vo vesmíre neplatí zotrvačnosť."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Niečo rotujúce nemá dôvod odletieť preč.“ <b>Pravda:</b> Bez gravitácie by Mesiac podľa 1. Newtonovho zákona letel rovnou čiarou preč. Zemská gravitácia slúži ako 'špagát', ktorý ho neustále ohýba k Zemi, takže opisuje kružnicu/elipsu."}, {"q": "29. Z okna vyhodíš vodorovne úplne rovnakou počiatočnou rýchlosťou (5 m/s) ťažkú oceľovú guľu a ľahučkú pingpongovú loptičku. Ak zanedbáme odpor vzduchu, ktorá doletí ĎALEJ od steny budovy?", "options": ["Oceľová guľa doletí oveľa ďalej.", "Pingpongová loptička doletí ďalej.", "Obe dopadnú presne na TO ISTÉ miesto (rovnaká vzdialenosť).", "Dopadnú rovnako, ale loptičke to potrvá dlhšie."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Hmotnosť určuje, ako ďaleko vrh zájde.“ <b>Pravda:</b> Vodorovná rýchlosť (v) je rovnaká, a čas dopadu (t) nezávisí od hmotnosti (ako pri voľnom páde). Pretože obidve majú rovnaké v a rovnaké t, prejdená dráha vodorovne s = v * t musí byť pre obe úplne zhodná."}, {"q": "30. Vystrelíš ohňostrojovú raketu priamo kolmo hore rýchlosťou 50 m/s (bez odporu vzduchu). Keď po parabole spadne opäť do výšky štartu (letí okolo tvojej tváre smerom k zemi), aká je jej zvislá rýchlosť?", "options": ["Je menšia, pretože letom sa energia vyčerpala.", "Je väčšia, pretože pád k zemi dodáva energiu navyše.", "Je PRESNE rovnaká ako pri štarte (50 m/s), len opačného smeru.", "Rýchlosť bude 0 m/s."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Padajúca loptička je vždy pomalšia ako keď som ju vyhodil.“ <b>Pravda:</b> V realite ju brzdí vzduch. Vo fyzikálnom vákuu však platí dokonalá symetria vrhu a zachovanie mechanickej energie. Výstup hore trvá rovnako dlho ako pád dolu, a rýchlosť dopadu sa presne vyrovná rýchlosti výhodu."}, {"q": "31. Na Mesiaci je gravitačné zrýchlenie asi len šestinové v porovnaní so Zemou. Ak dovezieme na Zem z Mesiaca 1 kg mesačných hornín, čo sa zmení?", "options": ["Ich hmotnosť narastie na 6 kg, ale ich tiaž zostane rovnaká.", "Ich hmotnosť (1 kg) zostane ÚPLNE ROVNAKÁ, rapídne sa však zvýši ich tiaž (Newtony).", "Kameň sa roztriešti, lebo zemská gravitácia ho rozdrví.", "Nezmení sa vôbec nič."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Hmotnosť a tiaž sú to isté a menia sa vo vesmíre.“ <b>Pravda:</b> Hmotnosť (počet atómov, meraná v kg) je nemenná všade vo vesmíre. Mení sa len TIAŽ (sila, ktorou kameň tlačí na poličku), pretože Zem kameň ťahá silnejšou rukou (väčším gravitačným zrýchlením g)."}, {"q": "32. Fyzikálna konštanta „g“ na Zemi (9,81 m/s²) nám presne hovorí:", "options": ["Akou silou priťahuje Zem Slnko.", "Koľko Newtonov sily vyvíja Zem na každý meter kubický vesmíru.", "Koľko metrov preletí teleso voľným pádom za prvú sekundu.", "Zmenu rýchlosti v m/s, ktorú získa teleso padajúce vo vákuu každú jednu sekundu."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Hodnota g (9,81) sú prejdené metre.“ <b>Pravda:</b> g je ZRÝCHLENIE. Znamená to, že každú sekundu pádu (0s, 1s, 2s...) sa tvoja rýchlosť zvýši o 9,81 metra za sekundu."}, {"q": "33. Keby vo vákuu všetky telesá len neustále zrýchľovali o 9,81 m/s², prečo dažďová kvapka padajúca z mrakov (niekoľko kilometrov vysoko) do nás nenarazí rýchlosťou guľky a nezabije nás?", "options": ["Lebo mraky nie sú až tak vysoko.", "Lebo dažďová kvapka má takú malú hmotnosť, že na ňu gravitácia nepôsobí.", "Lebo vzduch okolo kvapky kladie odpor, ktorý časom vyrovná gravitačnú silu a kvapka začne padať stálou (medznou) rýchlosťou.", "Lebo kvapky počas pádu stihnú zamrznúť a to ich spomalí."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Padajúci objekt na Zemi zrýchľuje navždy a nekonečne.“ <b>Pravda:</b> Atmosféra chráni povrch. Odpor vzduchu rastie s rýchlosťou kvapky. Keď odpor vzduchu zospodu vyrovná váhu kvapky zhora, zrýchlenie sa vynuluje a kvapka ďalej padá bezpečne nízkou konštantnou rýchlosťou."}, {"q": "34. Potrebuje gravitačná sila Zeme nejaké 'prenosové médium', napríklad zemskú atmosféru (vzduch), aby mohla priťahovať objekty vo vesmíre?", "options": ["Áno, mimo atmosféry už gravitácia rýchlo klesá k nule.", "Nie, gravitácia sa šíri priestorom a bez problémov pôsobí aj cez absolútne prázdne vákuum.", "Áno, gravitácia sa šíri cez magnetické siločiary vzduchu.", "Nie, ale vákuum silu gravitácie obrovsky blokuje."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Gravitácia je pripútaná k vzduchu alebo atmosfére.“ <b>Pravda:</b> Na rozdiel od zvukových vĺn, ktoré potrebujú vzduch alebo vodu, gravitácia (zakrivenie časopriestoru) sa šíri vesmírom úplne nezávisle na akomkoľvek médiu."}, {"q": "35. Loptičku A hodíš z mosta priamo HORE rýchlosťou 10 m/s. Loptičku B hodíš v tej istej chvíli priamo DOLE k vode rýchlosťou 10 m/s. Keď loptička A dosiahne svoj vrchol, začne padať a preletí okolo miesta vrhu smerom nadol. Čo bude v tom momente platiť o jej rýchlosti (bez odporu vzduchu)?", "options": ["Bude padať rovnako rýchlo, akou rýchlosťou bola loptička B hodená nadol (10 m/s).", "Bude oveľa pomalšia ako loptička B na začiatku.", "Zastaví sa hneď po dopade na roveň mosta.", "Loptička A bude mať už rýchlosť aspoň 50 m/s."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Loptička A po výstupe hore spomalí a bude padať od nuly len pomaly.“ <b>Pravda:</b> Symetria! Keď loptička A klesne na úroveň tvojej ruky, jej zvislá rýchlosť je presne 10 m/s smerom nadol. Od tohto momentu letí k vode ÚPLNE ROVNAKO ako loptička B, ktorú si hodil priamo dolu."}, {"q": "36. Vo vzorci pre gravitačnú silu (F = G*m1*m2 / r²) vystupuje veľké písmeno 'G'. Aký je základný rozdiel medzi veľkým 'G' a malým 'g'?", "options": ["Žiadny, sú to len iné formy zápisu tej istej hodnoty (9,81).", "Veľké 'G' je tiaž, malé 'g' je hmotnosť.", "Veľké 'G' (gravitačná konštanta) je univerzálne číslo platné všade vo vesmíre, kým malé 'g' (tiažové zrýchlenie) je na každej planéte úplne iné.", "Veľké 'G' sa používa iba v americkom systéme jednotiek."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „G a g sa dajú zamieňať alebo sú to len zvyky zápisu.“ <b>Pravda:</b> 'G' ukazuje, ako silná je gravitácia plošne v našom vesmíre (je nesmierne malá!). Malé 'g' je špecifický vypočítaný výsledok sily na konkrétnej planéte (napr. na Mesiaci je g = 1,62, ale G je tam stále rovnaké ako na Zemi)."}, {"q": "37. Pri šikmom vrhu kameňa (letí šikmo do vzduchu po parabole) skúmame fázu jeho STÚPANIA nahor. Aký uhol zvierajú vektor jeho okamžitej rýchlosti (v) a vektor gravitačného zrýchlenia (g)?", "options": ["Presne 90° (pravý uhol).", "Ostrý uhol (menej ako 90°), preto kameň stúpa.", "Tupý uhol (viac ako 90°), pretože gravitácia pôsobí proti smeru stúpania a spomaľuje ho zvislo.", "Sú rovnobežné."], "answer": 2, "explanation": "<b>Miskoncepcia:</b> „Gravitácia pôsobí buď kolmo dole (90°) alebo priamo proti pohybu (180°).“ <b>Pravda:</b> Kameň letí šikmo dopredu a hore. Gravitácia pôsobí čisto kolmo nadol. Tento tupý uhol spôsobuje, že kameň sa horizontálne nebrzdí, ale vertikálne prudko stráca rýchlosť."}, {"q": "38. Klasický experiment (Lov na opicu): Poľovník s laserovým zameriavačom namieri pušku vodorovne PRESNE na opicu, ktorá visí na vzdialenom strome. Presne v milisekunde, kedy vyletí guľka z hlavne, sa opica pustí konára a padá zvislo dolu. Ako by mal poľovník mieriť, aby padajúcu opicu zasiahol (odpor vzduchu ignorujeme)?", "options": ["Musí namieriť kúsok POD ňu, aby zohľadnil pád opice.", "Musí mieriť kúsok NAD ňu, lebo aj guľka pri lete klesá.", "Nezasiahne ju nikdy, je to fyzikálne nemožné.", "Musí namieriť PRESNE NA ŇU (ako mieri). Zatiaľ čo opica padá g-čkom, gravitácia rovnakým g-čkom zakrivuje aj letiaci projektil nadol z priamej dráhy, takže sa v lufte zrazia."], "answer": 3, "explanation": "<b>Miskoncepcia:</b> „Vodorovný let znamená, že guľka nepodlieha voľnému pádu rovnakou mierou.“ <b>Pravda:</b> Obe telesá zvislo klesajú z pôvodnej namierenej výšky podľa y = 1/2*gt². Obe padajú smerom nadol úuuplne rovnako. Preto strela neminie opicu, len ju zasiahne nižšie vo vzduchu."}, {"q": "39. Keplerov zákon hovorí, že rýchlosť obehu planéty závisí od vzdialenosti. Ak porovnáš vnútornú planétu (Venuša) a vonkajšiu (Urán), čo zistíš?", "options": ["Venuša (bližšie) má oveľa väčšiu obežnú rýchlosť, aby ju nevyhnutne nevtiahlo do Slnka silnejšie gravitačné pole.", "Urán (ďalej) sa hýbe oveľa rýchlejšie, lebo musí opísať obrovskú vzdialenosť.", "Obe majú presne rovnakú obvodovú rýchlosť, inak by to nebola stabilná sústava.", "Závisí to len od toho, z čoho sú planéty zložené."], "answer": 0, "explanation": "<b>Miskoncepcia:</b> „Planéty na okraji galaxie alebo sústavy musia ísť rýchlejšie kvôli dlhšej dráhe.“ <b>Pravda:</b> Gravitácia prudko slabne so vzdialenosťou. Blízka planéta cíti ohromnú silu, ktorú dokáže vyvážiť (stáčať do kruhu bez pádu do Slnka) len vďaka obrovskej rýchlosti vpred."}, {"q": "40. V učebnici fyziky sa často píše o „homogénnom gravitačnom poli“. Znamená to, že Zem v tomto modeli pôsobí na všetky objekty presne rovnakou SILOU (rovnakým počtom Newtonov)?", "options": ["Áno, to je samotná definícia homogénneho poľa.", "Nie, znamená to, že gravitácia všade pôsobí rovnakým ZRÝCHLENÍM a v rovnakom smere. Ale gravitačná SILA na rôzne predmety sa stále líši podľa ich hmotnosti (F = mg).", "Nie, znamená to, že gravitácia tam už vôbec nepôsobí.", "Áno, ale len pre kovy."], "answer": 1, "explanation": "<b>Miskoncepcia:</b> „Homogénne pole = rovnaká sila na čokoľvek.“ <b>Pravda:</b> Slovo homogénny (rovnorodý) opisuje len to 'prostredie' samotné (vektor intenzity/zrýchlenia g má rovnaký smer a veľkosť). Ale predmet s hmotnosťou 10 kg bude pole ťahať 10-krát silnejšie než predmet s hmotnosťou 1 kg."}];
        let currentQuestion = 0; let score = 0;
        const questionHeader = document.getElementById('questionHeader');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackBox = document.getElementById('feedbackBox');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');

        function loadQuestion() {
            feedbackBox.className = 'feedback-box'; feedbackBox.innerHTML = '';
            nextBtn.classList.remove('show'); optionsContainer.innerHTML = '';
            const q = quizData[currentQuestion];
            questionHeader.textContent = `Otázka ${currentQuestion + 1} z ${quizData.length}`;
            questionText.innerHTML = q.q;
            progressBar.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerHTML = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = quizData[currentQuestion]; const allBtns = optionsContainer.children;
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.answer) allBtns[i].classList.add('correct');
            }
            if (selectedIndex === q.answer) {
                score++;
                feedbackBox.className = 'feedback-box show correct-feedback';
                feedbackBox.innerHTML = `<b>Správne! 🎉</b> ${q.explanation}`;
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackBox.className = 'feedback-box show incorrect-feedback';
                feedbackBox.innerHTML = `<b>Nesprávne.</b> ${q.explanation}`;
            }
            if (currentQuestion === quizData.length - 1) nextBtn.textContent = 'Zobraziť výsledky ➔';
            nextBtn.classList.add('show');
            setTimeout(() => nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) loadQuestion(); else showResults();
        }

        function showResults() {
            progressBar.style.width = '100%'; quizScreen.style.display = 'none'; resultScreen.style.display = 'block';
            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreDisplay').innerHTML = `<span>${score}</span><span style="font-size: 1.2rem; opacity: 0.8">/${quizData.length}</span>`;
            document.getElementById('resultTitle').textContent = percentage >= 90 ? "Gravitačný fenomén! 🌍" : percentage >= 70 ? "Veľmi dobrá práca! 👍" : percentage >= 50 ? "Dobrý základ. 📚" : "Zemská príťažlivosť ťa stiahla k zemi. 💡";
            document.getElementById('resultMsg').textContent = percentage >= 90 ? "Výborne! Nenechal si sa nachytať na falošné predstavy o vrhu, beztiažovom stave a gravitácii vo vákuu. Dokonalé porozumenie!" : percentage >= 70 ? "Väčšinu mýtov o gravitácii máš ujasnenú. Nezabudni na drobný rozdiel medzi zvislým a vodorovným vrhom." : percentage >= 50 ? "Obežné dráhy a Keplerove zákony sú fajn, ale pri kinematických vrhoch (voľný pád verzus šikmý vrh) ti robí problém nezávislosť zložiek pohybu." : "Zopakuj si základy vodorovného vrhu. Kľúčové je zapamätať si, že vodorovná rýchlosť a zvislý pád sa navzájom vôbec neovplyvňujú!";
        }
        loadQuestion();
    </script>
